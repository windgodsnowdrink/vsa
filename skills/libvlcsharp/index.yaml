name: libvlcsharp
version: 1.0.0
description: 基于LibVLCSharp的AOT编译媒体处理工具
author: Trae AI
created_at: 2026-01-22
updated_at: 2026-01-22

# 技能类型
type: media

# AOT架构信息
aot:
  enabled: true
  framework: net10.0
  self_contained: true
  runtime_identifier: win-x64
  optimization_level: Release
  publish_date: 2026-01-22

# 功能特性
features:
  - 媒体文件播放
  - 媒体文件录制
  - 媒体流媒体
  - 媒体格式转换
  - 媒体信息获取
  - 编解码器列表
  - 过滤器列表
  - 性能基准测试

# 技术栈
tech_stack:
  - C#
  - .NET 10.0
  - LibVLCSharp
  - LibVLCSharp.WinForms
  - LibVLCSharp.WPF
  - LibVLCSharp.Platforms
  - Microsoft.Extensions.DependencyInjection
  - Microsoft.Extensions.Caching.Memory
  - Microsoft.Extensions.Logging
  - Microsoft.Extensions.Options
  - System.CommandLine

# 脚本信息
scripts:
  - name: libvlcsharp_aot
    path: scripts/libvlcsharp_aot.cs
    description: AOT编译的LibVLCSharp工具
    aot: true
    commands:
      - play
      - record
      - stream
      - convert
      - info
      - list-codecs
      - list-filters
      - benchmark
      - help

# 文档信息
documentation:
  - name: 技能文档
    path: SKILL.md
    language: zh-CN
  - name: 技术参考
    path: reference/README.md
    language: zh-CN
  - name: 使用示例
    path: reference/examples.md
    language: zh-CN

# 依赖项
dependencies:
  - name: LibVLCSharp
    version: 3.8.0
    type: nuget
  - name: LibVLCSharp.WinForms
    version: 3.8.0
    type: nuget
  - name: LibVLCSharp.WPF
    version: 3.8.0
    type: nuget
  - name: LibVLCSharp.Platforms
    version: 3.8.0
    type: nuget
  - name: Microsoft.Extensions.DependencyInjection
    version: 10.0.0
    type: nuget
  - name: Microsoft.Extensions.Caching.Memory
    version: 10.0.0
    type: nuget
  - name: Microsoft.Extensions.Logging
    version: 10.0.0
    type: nuget
  - name: Microsoft.Extensions.Options
    version: 10.0.0
    type: nuget
  - name: System.CommandLine
    version: 2.0.0
    type: nuget

# 性能指标
performance:
  - name: 媒体播放速度
    description: 媒体文件播放的速度
    value: "约 100ms/文件"
  - name: 媒体录制速度
    description: 媒体录制的速度
    value: "约 200ms/文件"
  - name: 媒体转换速度
    description: 媒体格式转换的速度
    value: "约 500ms/MB"
  - name: 媒体信息获取速度
    description: 媒体信息获取的速度
    value: "约 50ms/文件"

# 使用场景
use_cases:
  - 媒体播放器
  - 媒体录制
  - 媒体流
  - 媒体格式转换
  - 媒体信息获取
  - 编解码器列表
  - 过滤器列表
  - 性能基准测试

# 限制
limitations:
  - 需要安装VLC播放器
  - 网络连接稳定性要求较高
  - 批量操作时内存使用较大
  - 性能测试可能对系统造成压力
  - 仅支持字符串媒体格式

# 配置选项
configuration:
  - name: VLC_PLUGIN_PATH
    description: VLC插件路径
    type: string
    default: "%ProgramFiles%\\VideoLAN\\VLC\\plugins"
  - name: VLC_LIB_PATH
    description: VLC库路径
    type: string
    default: "%ProgramFiles%\\VideoLAN\\VLC"
  - name: LIBVLCSharp_LOG_LEVEL
    description: LibVLCSharp日志级别
    type: string
    default: "INFO"
  - name: LIBVLCSharp_CACHE_DIR
    description: LibVLCSharp缓存目录
    type: string
    default: "%LOCALAPPDATA%\\LibVLCSharp\\Cache"

# 兼容性
compatibility:
  - Windows x64
  - Linux x64
  - macOS x64

# 维护状态
maintenance:
  status: active
  last_updated: 2026-01-22
  next_update: 2026-03-22