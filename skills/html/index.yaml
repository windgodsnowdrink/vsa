# HTML AOT 技能 - HTML 技能
# Version: 1.0.0
# Author: VSA Architecture Team
# Description: 基于 .NET 10 的高性能 HTML 技能实现，支持 AOT 编译，提供单文件执行脚本，具有极高的性能和低内存占用
# Skill Type: System Function
# Dependencies:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Options@10.0.0
# - HtmlAgilityPack@1.11.58
# - AngleSharp@1.10.0
# - HtmlSanitizer@8.0.482
# - CsQuery@1.3.4
# - System.Text.RegularExpressions@4.3.1
# - System.Net.Http@4.3.4
# - System.IO@4.3.0
# - System.Collections.Immutable@8.0.0
# Application Scenarios: HTML 相关功能，包括解析、清理、内容提取、网站抓取、验证和压缩
# Activation Conditions: 当需要 HTML 处理功能时激活
# Main Features:
# - HTML 解析: 使用 HtmlAgilityPack 和 AngleSharp 解析 HTML
# - HTML 清理: 使用 HtmlSanitizer 清理不安全的 HTML
# - 内容提取: 使用 XPath 和 CSS 选择器提取内容
# - 网站抓取: 抓取网站内容，包括标题、链接、图片等
# - HTML 验证: 验证 HTML 文档的有效性
# - HTML 压缩: 压缩 HTML 文件，减少文件大小
# - 缓存优化: 智能缓存机制，提高性能
# - AOT 编译优化: 使用 .NET 10 AOT 编译，提高性能和降低内存占用
# - 命令行工具: 完整的命令行界面，支持多种操作和别名
# - 配置管理: 支持环境变量和配置文件配置
# Performance Features:
# - AOT 编译性能: 启动时间比 JIT 快 3-5 倍，内存占用低 20-30%
# - 运行时优化: GC 优化、线程池优化、内存管理优化
# - 网络优化: 高效的网络请求处理
# - 内存优化: 使用缓存减少内存分配
# - 并发支持: 合理配置线程池大小，支持高并发
# - CPU 优化: 运行时 CPU 使用率更加稳定
# - 响应时间: 尾延迟显著降低
# Technical Features:
# - 模块化设计: 清晰的代码结构和模块划分
# - 依赖注入: 使用 Microsoft.Extensions.DependencyInjection
# - 异步编程: Task-based 异步模式
# - 高性能算法: 优化的 HTML 处理算法
# - AOT 编译技术: 完整的 AOT 编译支持
# - 单文件执行脚本: net10 的单文件执行脚本
# - 完整的命令行支持: 支持多种命令和选项
# - 别名支持: 命令别名和快捷方式
# - 配置选项: 使用 Options 模式管理配置
# - 日志记录: 完整的日志记录功能
# - 错误处理: 健壮的错误处理机制
# AOT Compilation Support:
# - AOT Core Files:
#   - scripts/html_aot.cs - HTML AOT 核心实现
#   - scripts/html_aot.setting.json - AOT 编译配置
#   - scripts/html_aot.run.json - 运行环境配置
# - AOT Compilation Benefits:
#   - Fast Startup: 3-5x faster than JIT compilation
#   - Low Memory Usage: 20-30% lower memory footprint
#   - Simple Deployment: Single-file execution, no runtime dependency
#   - Stable Performance: Compile-time optimizations
#   - High Security: Reduced runtime attack surface
# - AOT Compilation Options:
#   - Target Framework: net11.0
#   - Runtime Identifier: win-x64
#   - Trim Mode: partial
#   - Memory Optimizations: Enabled
#   - String Optimizations: Enabled
# Command Line Support:
# - Commands:
#   - parse: 解析 HTML 文件或 URL
#   - sanitize: 清理 HTML 内容
#   - extract: 提取 HTML 内容
#   - scrape: 抓取网站内容
#   - validate: 验证 HTML 有效性
#   - minify: 压缩 HTML 文件
#   - config: 显示配置信息
#   - help: 显示帮助信息
# - Command Aliases:
#   - p: parse
#   - s: sanitize
#   - e: extract
#   - sc: scrape
#   - v: validate
#   - m: minify
#   - c: config
#   - h: help
#   - ?: help
#   - --help: help
#   - -h: help
# Environment Variables:
# - HTML_ENABLE_CACHE: 启用缓存
# - HTML_CACHE_SIZE: 缓存大小
# - HTML_TIMEOUT: 超时时间（秒）
# - HTML_ENABLE_DETAILED_LOGGING: 启用详细日志
# - HTML_MAX_DOCUMENT_SIZE: 最大文档大小（字节）
# - HTML_ENABLE_JAVASCRIPT: 启用 JavaScript
# - HTML_ENABLE_CSS: 启用 CSS
# - HTML_ENABLE_IMAGES: 启用图片
# Version Compatibility:
# - .NET Version: .NET 10.0 及以上
# - Operating System: Windows、Linux、macOS
# - Architecture: x64、ARM64
# - Browsers: Chrome、Firefox、Edge、Safari
