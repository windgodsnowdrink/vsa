# audio Agent Skill - audio 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能音频处理技能，提供音频录制、播放、编辑、转换、语音识别、文本到语音等核心功能
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - NAudio@2.2.1
# - Accord.Audio@3.8.0
# - Microsoft.CognitiveServices.Speech@1.37.0
# 应用场景: 音频录制、播放、编辑、转换、语音识别、文本到语音、音频增强、实时通信音频处理等
# 激活条件: 需要音频相关功能时激活
# 主要功能:
# - 音频录制与播放
# - 音频编辑与转换
# - 语音识别 (ASR)
# - 文本到语音 (TTS)
# - 音频增强
# - 实时通信 (RTC) 音频处理
# - 音视频同步处理
# - AOT 编译优化
# AOT 编译支持: 支持将音频应用编译为本机代码，提高启动速度和运行性能
# 性能特性:
# - 高性能设计，支持高并发音频处理
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化音频处理延迟
# - AOT 编译优化，提高启动速度和运行性能
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程，避免阻塞主线程
# - 高性能算法，优化音频处理效率
# - 支持多种音频格式
# - 可扩展架构，支持自定义扩展
# - 与多种语音引擎集成
