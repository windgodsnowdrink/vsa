# brighter Agent Skill - brighter 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能 Brighter 命令查询责任分离（CQRS）技能，支持 AOT 编译优化，提供强大的消息处理和命令查询分离功能
# 技能类型: 系统功能
# 依赖项:
# - Paramore.Brighter@9.0.0
# - Paramore.Brighter.Extensions.DependencyInjection@9.0.0
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# 应用场景: CQRS 架构实现、命令处理、查询处理、消息中间件集成、事件驱动架构、AOT 编译优化等
# 激活条件: 需要 Brighter 功能时激活
# 主要功能:
# - 命令处理和查询处理分离
# - 支持多种消息中间件集成
# - 支持 AOT 编译优化
# - 支持事务处理
# - 支持重试和熔断机制
# - 支持异步和同步处理
# - 支持多种命令处理器和查询处理器
# - 支持生产级配置
# 性能特性:
# - 高性能设计，支持高并发场景
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化消息处理速度
# - AOT 编译优化，提高运行时性能
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程，避免阻塞主线程
# - 高性能算法，优化处理效率
# - 支持多种 CQRS 场景
# - 支持 AOT 编译
# - 与 .NET 生态系统无缝集成
# - 支持多种消息中间件
# AOT 编译支持: 支持将 Brighter 应用编译为本机代码，提高运行时性能和启动速度
