# Algorithm Agent Skill - 高性能算法库
# 版本: 1.0.0
# 作者: VSA Architecture Team
# 描述: 基于.NET 10的高性能算法库，包含分布式一致性算法、抖动算法等企业级算法实现
# 技能类型: 算法库
# 依赖:
# - System.Threading.Channels@8.0.0
# - System.Collections.Concurrent@8.0.0
# - System.Runtime.CompilerServices.Unsafe@8.0.0
# 适用场景: 分布式系统设计、高并发服务、可靠性工程、性能优化、负载均衡
# 激活条件: 需要分布式一致性、负载均衡或性能优化时激活
# 主要功能:
# - Raft分布式一致性算法实现
# - 生产级抖动算法（Jitter Algorithm）
# - 高性能并发控制算法
# - 负载均衡算法
# - 分布式锁实现
# - 限流算法
# - 重试机制
# 性能特性:
# - 使用Span<T>和Memory<T>进行零拷贝操作
# - 基于Channels的异步处理
# - 支持尾延迟优化（TailLatencyOptimizer）
# - 内存池优化
# - 无锁并发数据结构
# - CPU缓存行对齐
# 技术特性:
# - 基于.NET 10的最新特性
# - 支持AOT编译
# - 提供完整的诊断指标
# - 支持多种配置方式
# - 模块化设计，易于扩展
# - 提供详细的使用示例
# 设计模式:
# - 状态机设计
# - 策略模式
# - 观察者模式
# - 工厂模式
# - 建造者模式
# - 适配器模式