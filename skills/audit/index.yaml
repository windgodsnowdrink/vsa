# audit Agent Skill - audit 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能审计日志技能，提供审计日志记录、查询、分析、加密和可视化等核心功能
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Configuration@10.0.0
# - Microsoft.EntityFrameworkCore@10.0.0
# 应用场景: 系统审计、用户行为审计、数据变更审计、安全审计、合规审计等
# 激活条件: 需要审计功能时激活
# 主要功能:
# - 审计日志记录
# - 审计日志查询
# - 审计日志分析
# - 审计日志加密
# - 审计日志导出
# - 实时审计监控
# - 审计策略管理
# - 审计报告生成
# - AOT 编译优化
# AOT 编译支持: 支持将审计应用编译为本机代码，提高启动速度和运行性能
# 性能特性:
# - 高性能设计，支持高并发审计日志处理
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化审计日志处理延迟
# - AOT 编译优化，提高启动速度和运行性能
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程，避免阻塞主线程
# - 高性能算法，优化审计日志处理效率
# - 支持多种审计日志存储方式
# - 支持审计日志加密
# - 可扩展架构，支持自定义扩展
# - 与多种框架集成
