# cap Agent Skill - CAP 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能 CAP（分布式事务一致性）技能，支持 AOT（提前编译）编译，用于实现分布式事务、事件总线和消息队列功能
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - DotNetCore.CAP@8.0.0
# - DotNetCore.CAP.Redis@8.0.0
# - DotNetCore.CAP.MySql@8.0.0
# 应用场景: 分布式事务、事件总线、消息队列、异步通信、微服务架构等
# 激活条件: 需要分布式事务或事件总线功能时激活
# 主要功能:
# - 分布式事务一致性保证
# - 事件总线实现
# - 支持多种消息队列（Redis、RabbitMQ、Kafka 等）
# - 支持多种数据库（MySQL、PostgreSQL、SQL Server 等）
# - 支持 AOT 编译优化
# - 支持批量处理
# - 支持异步编程模型
# - 支持事务补偿机制
# 性能特性:
# - 高性能设计，支持高并发场景
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化消息处理速度
# - AOT 编译优化，提高运行时性能
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程，避免阻塞主线程
# - 高性能算法，优化处理效率
# - 支持多种 CAP 场景
# - 支持 AOT 编译
# - 与 .NET 生态系统无缝集成
# - 支持多种消息队列和数据库
# AOT 编译支持: 支持将 CAP 应用编译为本机代码，提高运行时性能和启动速度
