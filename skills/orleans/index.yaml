name: "Orleans"
description: "Orleans 技能 - 提供 Orleans 框架的集成和扩展功能"
version: "1.0.0"
author: "VSA Architecture Team"
email: "info@vsa-arch.com"
url: "https://vsa-arch.com"

# 依赖项
dependencies:
  - name: "Microsoft.Extensions.DependencyInjection"
    version: "10.0.0"
  - name: "Microsoft.Extensions.Logging"
    version: "10.0.0"
  - name: "Microsoft.Orleans.Core"
    version: "8.0.0"
  - name: "Microsoft.Orleans.Client"
    version: "8.0.0"
  - name: "Microsoft.Orleans.Server"
    version: "8.0.0"
  - name: "System.Text.Json"
    version: "10.0.0"
  - name: "System.Threading.Tasks.Dataflow"
    version: "8.0.0"

# 技能特性
features:
  - name: "Orleans 集成"
    description: "与 Orleans 框架的无缝集成"
  - name: "事件溯源"
    description: "支持 Orleans 事件溯源模式"
  - name: "状态机"
    description: "支持 Orleans 状态机模式"
  - name: "集群管理"
    description: "管理 Orleans 集群节点"
  - name: "部署工具"
    description: "提供 Orleans 应用的部署工具"

# AOT 编译选项
aot:
  publishAot: true
  readyToRun: true
  tieredCompilation: true
  optimizeForSize: false
  trimMode: "partial"

# 支持的运行时
runtimes:
  - "win-x64"
  - "linux-x64"
  - "osx-x64"
  - "win-arm64"
  - "linux-arm64"
  - "osx-arm64"

# 脚本信息
scripts:
  - name: "orleans_eventsourcing_integration.cs"
    description: "Orleans 事件溯源集成功能"
  - name: "orleans_statemachine_integration.cs"
    description: "Orleans 状态机集成功能"
  - name: "orleans_extensions.cs"
    description: "Orleans 核心扩展功能，包含所有服务实现"

# 参考文档
documentation:
  - name: "README.md"
    description: "详细参考文档"
  - name: "examples.md"
    description: "使用示例文档"

# 环境要求
environment:
  dotnet: "10.0"
  os: ["Windows", "Linux", "macOS"]

# 许可证
license:
  name: "MIT"
  url: "https://opensource.org/licenses/MIT"

# 发布日期
published:
  date: "2026-01-24"
  version: "1.0.0"

# 标签
tags:
  - "orleans"
  - "actor-model"
  - "dotnet"
  - "aot"
  - "integration"
