# etcd Agent Skill - etcd 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的 etcd 技能，支持 AOT 编译，提供高性能 etcd 功能
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Hosting@10.0.0
# - Microsoft.Extensions.Options@10.0.0
# 应用场景:
# - 分布式键值存储
# - 服务发现和注册
# - 分布式锁
# - 配置中心
# - 分布式协调
# - 高性能数据存储
# 激活条件:
# - 需要 etcd 功能时激活
# - 需要 AOT 编译的高性能 etcd 时激活
# 主要功能:
# - 键值对操作（设置、获取、删除）
# - 前缀匹配查询
# - 事务处理
# - 版本管理
# - AOT 编译支持
# 性能特性:
# - AOT 编译优化
# - 内存优化
# - 并发支持
# - 快速启动
# 技术特性:
# - 模块化设计
# - 依赖注入
# - 异步编程
# - 高性能算法
# - 可扩展架构
# - Options 配置模式
# - 日志记录支持
# AOT 特性:
# - 支持 PublishAot=true
# - 不变全球化支持
# - 编译优化
# - ReadyToRun 支持