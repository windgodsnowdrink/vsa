# NetPro Agent Skill - NetPro 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的 NetPro 技能实现，提供强大的插件系统和扩展功能
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Options@10.0.0
# - Microsoft.Extensions.FileProviders@10.0.0
# 应用场景:
# - 企业级应用开发
# - 可扩展系统架构
# - 插件化应用
# - 微服务架构
# 激活条件: 当需要 NetPro 插件系统和扩展功能时激活
# 主要功能:
# - 插件系统：支持动态加载和管理插件，实现功能扩展
# - 扩展管理器：提供统一的扩展点管理，支持自定义扩展
# - 热重载：支持插件和扩展的热重载，无需重启应用
# - 依赖注入：集成 .NET 依赖注入系统，支持插件和扩展的依赖注入
# - 配置管理：统一的配置管理，支持插件和扩展的配置
# 性能特性:
# - 高吞吐量：使用通道和批处理技术，支持高并发处理
# - 低延迟：使用 Span 和零拷贝技术，减少内存分配和拷贝
# - 内存优化：使用内存池和对象池，减少 GC 压力
# - 可扩展性：支持水平扩展，适用于大规模应用
# 技术特性:
# - 模块化设计：清晰的模块划分，易于扩展和维护
# - 依赖注入：使用 .NET 内置的依赖注入系统
# - 异步编程：全面支持异步操作，提高系统吞吐量
# - 高性能算法：使用高效的算法和数据结构
# - 跨平台支持：支持 Windows、Linux 和 macOS
# 安全特性:
# - 插件隔离：插件运行在隔离环境中，提高系统安全性
# - 权限控制：支持插件和扩展的权限控制
# - 错误处理：完善的错误处理机制，提高系统稳定性
# 部署特性:
# - 容器化支持：支持 Docker 容器部署
# - 云平台兼容：兼容主流云平台
# - AOT 编译：支持 Ahead-of-Time 编译，提高运行时性能
# AOT 编译选项:
# - PublishAot=true
# - ReadyToRun=true
# - TieredCompilation=true
# 支持的运行时:
# - win-x64
# - linux-x64
# - osx-x64
# - linux-arm64
# - osx-arm64
