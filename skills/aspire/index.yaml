# aspire Agent Skill - aspire 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的 aspire 技能实现，支持分布式应用开发、服务发现、配置管理等云原生功能
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Aspire.Hosting@8.0.0
# - Aspire.Dashboard@8.0.0
# 应用场景: 分布式应用开发、微服务架构、云原生部署、服务网格等
# 激活条件: 需要 aspire 相关功能时激活
# 主要功能:
# - 分布式应用开发和部署
# - 服务发现与注册
# - 配置管理
# - 健康检查与监控
# - 依赖管理
# - 高可用设计
# - 容器化支持
# - AOT 编译优化
# AOT 编译支持: 支持将应用编译为本机代码，提高启动速度和运行性能
# 性能特性:
# - 高性能设计，支持高并发处理
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化应用响应速度
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程，避免阻塞主线程
# - 高性能算法，优化应用处理效率
# - 容器化支持，无缝集成 Docker 和 Kubernetes
# - 可扩展架构，支持自定义扩展和插件开发
