# MediatR 智能体技能 - 中介者模式技能
# Version: 1.0.0
# Author: VSA 架构团队
# Description: 基于 .NET 10 的 MediatR 中介者模式技能实现，支持命令、查询、事件等消息处理
# Skill Type: 系统功能
# Dependencies:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - MediatR@12.0.0
# - MassTransit@8.0.0
# - Dapr.Client@1.0.0
# - Grpc.Net.Client@2.0.0
# - Confluent.Kafka@2.0.0
# - MQTTnet@4.0.0
# Application Scenarios: 命令处理、查询处理、事件发布/订阅、分布式系统集成等
# Activation Conditions: 当需要使用中介者模式处理消息时激活
# Main Features:
# - 命令处理
# - 查询处理
# - 事件发布/订阅
# - 管道行为
# - 分布式系统集成
# Performance Features:
# - 高性能设计
# - 内存优化
# - 并发支持
# - 批处理
# Technical Features:
# - 模块化设计
# - 依赖注入
# - 异步编程
# - 高性能算法
# - AOT 编译优化
# AOT 编译配置:
# - PublishAot=true
# - IncludeNativeLibrariesForSelfExtract=true
# - EnableCppCodeGen=true
# - PublishSingleFile=true
# - SelfContained=true
# - RuntimeIdentifier=win-x64
# - RuntimeIdentifier=linux-x64
# - RuntimeIdentifier=osx-x64

