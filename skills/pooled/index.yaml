# pooled Agent Skill - 内存池化集合技能
# Version: 1.0.0
# Author: VSA Architecture Team
# Description: 基于.NET 10的内存池化集合实现，提供高性能、低内存占用的集合类型
# Skill Type: System Function
# Dependencies:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Options@10.0.0
# - System.Collections.Immutable@10.0.0
# - System.Memory@10.0.0
# - System.Buffers@10.0.0
# - System.Threading.Tasks.Dataflow@10.0.0
# - System.IO.Pipelines@10.0.0
# Application Scenarios:
# - 高并发场景下的集合操作
# - 内存敏感的应用程序
# - 需要频繁创建和销毁集合的场景
# - 高性能服务器应用
# Activation Conditions: 当需要使用内存池化集合功能时激活
# Main Features:
# - 内存池化集合类型（List、Dictionary、HashSet等）
# - 零分配操作支持
# - 线程安全的集合实现
# - 高性能并发集合
# - 内存使用监控和优化
# - 自动内存回收和池化管理
# AOT Compilation Support:
# - PublishAot=true
# - TrimMode=partial
# - ReadyToRun=true
# - TieredCompilation=true
# Performance Features:
# - 零分配设计，减少GC压力
# - 内存池化，复用内存块
# - 并发优化，支持高并行度
# - 批量操作优化
# - 内存使用监控和分析
# - 缓存友好的数据结构
# Technical Features:
# - 模块化设计，易于扩展
# - 依赖注入集成
# - 异步编程支持
# - 高性能算法实现
# - 内存池管理
# - 零拷贝技术
# - 线程本地存储
# Deployment Options:
# - 支持Windows、Linux、macOS平台
# - 支持x64、arm64架构
# - 容器化部署支持
# - AOT编译部署
# - 自包含应用部署
# Security Features:
# - 内存安全设计
# - 线程安全实现
# - 输入验证和参数检查
# - 异常处理和错误恢复
# - 安全的内存管理
# Monitoring Features:
# - 内存使用指标
# - 性能计数器
# - 日志记录和跟踪
# - 健康检查支持
