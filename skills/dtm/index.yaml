# dtm Agent Skill - dtm 技能
# Version: 1.0.0
# Author: VSA Architecture Team
# Description: 基于 .NET 10 AOT 架构的高性能 dtm 技能实现
# Skill Type: System Function
# Dependencies:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Hosting@10.0.0
# - Microsoft.Extensions.Options@10.0.0
# Application Scenarios: 分布式事务管理、微服务协调、事务一致性保障
# Activation Conditions: 当需要 dtm 分布式事务功能时激活
# Main Features:
# - 分布式事务执行
# - 事务状态查询
# - 事务取消和恢复
# - 过期事务清理
# - 版本信息查询
# Performance Features:
# - AOT 预编译，极致启动速度
# - 异步编程模型，提高系统响应性
# - 低延迟设计，毫秒级事务处理
# - 内存优化，减少 GC 压力
# - 高性能事务缓存机制
# Technical Features:
# - 模块化设计，易于扩展
# - 依赖注入，便于测试和维护
# - 异步编程模型，提高并发能力
# - Options 配置模式，灵活配置
# - 完善的错误处理和日志记录
# - 支持命令行操作
# AOT Features:
# - 支持 .NET 10 PublishAot=true
# - 支持 InvariantGlobalization
# - 支持 PublishReadyToRun
# - 优化的 AOT 编译配置
# Command Line Support:
# - execute <operations> [transactionId]: 执行分布式事务
# - query <transactionId>: 查询事务状态
# - cancel <transactionId>: 取消事务
# - resume <transactionId>: 恢复事务
# - clean: 清理过期事务
# - version: 显示版本信息
# - help, --help, -h: 显示帮助信息
