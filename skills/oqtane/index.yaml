name: "Oqtane"
description: "Oqtane 技能 - 提供 Oqtane 框架的集成和扩展功能"
version: "1.0.0"
author: "Oqtane Community"
email: "info@oqtane.org"
url: "https://oqtane.org"

# 依赖项
dependencies:
  - name: "Microsoft.Extensions.DependencyInjection"
    version: "10.0.0"
  - name: "Microsoft.Extensions.Logging"
    version: "10.0.0"
  - name: "Microsoft.Extensions.Options"
    version: "10.0.0"
  - name: "System.Text.Json"
    version: "10.0.0"
  - name: "System.Net.Http.Json"
    version: "10.0.0"
  - name: "System.Threading.Tasks.Dataflow"
    version: "8.0.0"

# 技能特性
features:
  - name: "Oqtane 集成"
    description: "与 Oqtane 框架的无缝集成"
  - name: "模块管理"
    description: "管理 Oqtane 模块的安装、更新和卸载"
  - name: "主题管理"
    description: "管理 Oqtane 主题的安装和切换"
  - name: "用户管理"
    description: "管理 Oqtane 用户和角色"
  - name: "配置管理"
    description: "管理 Oqtane 应用配置"
  - name: "部署工具"
    description: "提供 Oqtane 应用的部署工具"

# AOT 编译选项
aot:
  publishAot: true
  readyToRun: true
  tieredCompilation: true
  optimizeForSize: false
  trimMode: "partial"

# 支持的运行时
runtimes:
  - "win-x64"
  - "linux-x64"
  - "osx-x64"
  - "win-arm64"
  - "linux-arm64"
  - "osx-arm64"

# 脚本信息
scripts:
  - name: "oqtane_extensions.cs"
    description: "Oqtane 核心扩展功能"
  - name: "api_documentation.cs"
    description: "API 文档生成"
  - name: "oqtane_integration.cs"
    description: "Oqtane 集成功能"

# 参考文档
documentation:
  - name: "README.md"
    description: "详细参考文档"
  - name: "examples.md"
    description: "使用示例文档"

# 环境要求
environment:
  dotnet: "10.0"
  os: ["Windows", "Linux", "macOS"]

# 许可证
license:
  name: "MIT"
  url: "https://opensource.org/licenses/MIT"

# 发布日期
published:
  date: "2026-01-24"
  version: "1.0.0"

# 标签
tags:
  - "oqtane"
  - "cms"
  - "dotnet"
  - "aot"
  - "integration"
