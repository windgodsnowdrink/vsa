# gRPC Agent Skill - gRPC 技能
# Version: 1.0.0
# Author: VSA Architecture Team
# Description: 基于 .NET 10 的高性能 gRPC 技能实现，支持 AOT 编译，提供单文件执行脚本，具有高性能、低内存占用的特点
# Skill Type: System Function
# Dependencies:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Options@10.0.0
# - Grpc.AspNetCore@2.62.0
# - Grpc.Net.Client@2.62.0
# - Google.Protobuf@3.26.1
# - System.Reflection.DispatchProxy@4.7.1
# - System.Net.Http@4.3.4
# - System.Net.Http.Json@8.0.0
# - System.Collections.Immutable@8.0.0
# Application Scenarios: gRPC 相关功能，包括服务端、客户端、服务定义和性能优化
# Activation Conditions: 当需要 gRPC 功能时激活
# Main Features:
# - gRPC 服务器：高性能 gRPC 服务器实现，支持多个服务
# - gRPC 客户端：完整的 gRPC 客户端实现，支持多种请求类型
# - 服务定义：包含 Greeter、Health、Ping 等服务
# - AOT 编译优化：使用 .NET 10 AOT 编译，提高性能和降低内存占用
# - 命令行工具：完整的命令行界面，支持多种操作和别名
# - 配置管理：支持环境变量和配置文件配置
# - 性能监控：内置执行时间监控和日志记录
# - 错误处理：健壮的错误处理机制
# - 网络优化：HTTP/2 连接优化和心跳配置
# - 安全支持：可选的 TLS 支持
# Performance Features:
# - AOT 编译性能：启动时间比 JIT 快 3-5 倍，内存占用低 20-30%
# - 运行时优化：GC 优化、线程池优化、内存管理优化
# - 网络优化：HTTP/2 连接池和多路复用
# - 内存优化：使用对象池和缓存减少内存分配
# - 并发支持：合理配置线程池大小，支持高并发
# - CPU 优化：运行时 CPU 使用率更加稳定
# - 响应时间：尾延迟显著降低
# Technical Features:
# - 模块化设计：清晰的代码结构和模块划分
# - 依赖注入：使用 Microsoft.Extensions.DependencyInjection
# - 异步编程：Task-based 异步模式
# - 高性能算法：优化的 gRPC 处理算法
# - AOT 编译技术：完整的 AOT 编译支持
# - 单文件执行脚本：net10 的单文件执行脚本
# - 完整的命令行支持：支持多种命令和选项
# - 别名支持：命令别名和快捷方式
# - 配置选项：使用 Options 模式管理配置
# - 日志记录：完整的日志记录功能
# - 网络优化：HTTP/2 连接池和心跳机制
# - 错误处理：健壮的错误处理和重试机制
# AOT Compilation Support:
# - AOT Core Files:
#   - scripts/grpc_aot.cs - gRPC AOT 核心实现
#   - scripts/grpc_aot.setting.json - AOT 编译配置
#   - scripts/grpc_aot.run.json - 运行环境配置
# - AOT Compilation Benefits:
#   - Fast Startup: 3-5x faster than JIT compilation
#   - Low Memory Usage: 20-30% lower memory footprint
#   - Simple Deployment: Single-file execution, no runtime dependency
#   - Stable Performance: Compile-time optimizations
#   - High Security: Reduced runtime attack surface
# - AOT Compilation Options:
#   - Target Framework: net11.0
#   - Runtime Identifier: win-x64
#   - Trim Mode: partial
#   - Memory Optimizations: Enabled
#   - String Optimizations: Enabled
# Command Line Support:
# - Commands:
#   - server: 启动 gRPC 服务器
#   - client: 启动 gRPC 客户端
#   - hello: 发送 Hello 请求
#   - ping: 发送 Ping 请求
#   - health: 发送健康检查请求
#   - config: 显示配置信息
#   - help: 显示帮助信息
# - Command Aliases:
#   - s: server
#   - c: client
#   - h: hello
#   - p: ping
#   - he: health
#   - conf: config
#   - ?: help
#   - --help: help
#   - -h: help
# Environment Variables:
# - GRPC_SERVER_HOST: 服务器主机
# - GRPC_SERVER_PORT: 服务器端口
# - GRPC_MAX_CONCURRENT_CALLS: 最大并发调用
# - GRPC_KEEP_ALIVE_TIME_SECONDS: 心跳时间
# - GRPC_MAX_MESSAGE_SIZE: 最大消息大小
# - GRPC_ENABLE_TLS: 启用 TLS
# - GRPC_CERTIFICATE_PATH: 证书路径
# - GRPC_CERTIFICATE_PASSWORD: 证书密码
# Version Compatibility:
# - .NET Version: .NET 10.0 及以上
# - Operating System: Windows、Linux、macOS
# - Architecture: x64、ARM64
# - gRPC Version: 2.62.0 及以上
# - Protobuf Version: 3.26.1 及以上
