# elsa Agent Skill - elsa 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的 Elsa 工作流管理技能，支持 AOT 编译
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Hosting@10.0.0
# - Microsoft.Extensions.Options@10.0.0
# 应用场景:
# - 工作流管理系统
# - 业务流程自动化
# - 状态机管理
# - 高性能工作流执行
# 激活条件:
# - 需要工作流管理功能时激活
# - 需要 AOT 编译的高性能工作流时激活
# 主要功能:
# - 工作流完整生命周期管理
# - 工作流状态查询和监控
# - 工作流实例列表管理
# - AOT 编译支持
# 性能特性:
# - AOT 编译优化
# - 高性能设计
# - 内存优化
# - 并发支持
# - 快速启动
# 技术特性:
# - 模块化设计
# - 依赖注入
# - 异步编程
# - 高性能算法
# - 可扩展架构
# - Options 配置模式
# - 日志记录支持
# AOT 特性:
# - 支持 PublishAot=true
# - 不变全球化支持
# - 编译优化
# - ReadyToRun 支持
