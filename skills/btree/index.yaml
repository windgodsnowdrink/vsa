# btree Agent Skill - btree 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能 B-Tree 数据结构技能，支持 AOT（提前编译）编译，提供强大的索引和数据存储功能
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - ZoneTree@1.0.0
# 应用场景: 高性能索引、数据存储、排序、搜索、AOT 编译优化等
# 激活条件: 需要 B-Tree 功能时激活
# 主要功能:
# - B-Tree 和 B+Tree 数据结构实现
# - 支持 AOT 编译优化
# - 高性能数据插入、删除和搜索
# - 支持事务处理
# - 支持并发访问
# - 支持多种数据类型
# - 支持持久化存储
# - 支持范围查询
# 性能特性:
# - 高性能设计，支持高并发场景
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化查询速度
# - AOT 编译优化，提高运行时性能
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程，避免阻塞主线程
# - 高性能算法，优化处理效率
# - 支持多种 B-Tree 场景
# - 支持 AOT 编译
# - 与 .NET 生态系统无缝集成
# - 支持持久化和内存模式
# AOT 编译支持: 支持将 B-Tree 应用编译为本机代码，提高运行时性能和启动速度
