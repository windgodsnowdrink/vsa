name: linkers
version: 1.0.0
description: 基于AOT编译的链接器工具，用于程序集分析、优化和验证
author: Trae AI
created_at: 2026-01-22
updated_at: 2026-01-22

# 技能类型
type: system

# AOT架构信息
aot:
  enabled: true
  framework: net10.0
  self_contained: true
  runtime_identifier: win-x64
  optimization_level: Release
  publish_date: 2026-01-22

# 功能特性
features:
  - 程序集分析
  - 符号解析
  - 依赖项列出
  - 程序集优化
  - 程序集验证
  - 程序集内容提取
  - 原生库绑定生成
  - 性能基准测试

# 技术栈
tech_stack:
  - C#
  - .NET 10.0
  - Microsoft.Extensions.DependencyInjection
  - Microsoft.Extensions.Caching.Memory
  - Microsoft.Extensions.Logging
  - Microsoft.Extensions.Options
  - System.CommandLine
  - System.Reflection.MetadataLoadContext
  - System.Reflection.Emit
  - Mono.Cecil

# 脚本信息
scripts:
  - name: linkers_aot
    path: scripts/linkers_aot.cs
    description: AOT编译的链接器工具
    aot: true
    commands:
      - analyze
      - resolve
      - list-dependencies
      - optimize
      - verify
      - extract
      - generate-bindings
      - benchmark
      - help

# 文档信息
documentation:
  - name: 技能文档
    path: SKILL.md
    language: zh-CN
  - name: 技术参考
    path: reference/README.md
    language: zh-CN
  - name: 使用示例
    path: reference/examples.md
    language: zh-CN

# 依赖项
dependencies:
  - name: Microsoft.Extensions.DependencyInjection
    version: 10.0.0
    type: nuget
  - name: Microsoft.Extensions.Caching.Memory
    version: 10.0.0
    type: nuget
  - name: Microsoft.Extensions.Logging
    version: 10.0.0
    type: nuget
  - name: Microsoft.Extensions.Options
    version: 10.0.0
    type: nuget
  - name: System.CommandLine
    version: 2.0.0
    type: nuget
  - name: System.Reflection.MetadataLoadContext
    version: 8.0.0
    type: nuget
  - name: System.Reflection.Emit
    version: 4.7.0
    type: nuget
  - name: Mono.Cecil
    version: 0.11.5
    type: nuget

# 性能指标
performance:
  - name: 程序集分析速度
    description: 程序集分析的速度
    value: "约 100ms/MB"
  - name: 符号解析速度
    description: 符号解析的速度
    value: "约 50ms/符号"
  - name: 依赖项列出速度
    description: 依赖项列出的速度
    value: "约 200ms/程序集"
  - name: 程序集优化速度
    description: 程序集优化的速度
    value: "约 300ms/MB"
  - name: 程序集验证速度
    description: 程序集验证的速度
    value: "约 50ms/程序集"

# 使用场景
use_cases:
  - 程序集分析
  - 符号解析
  - 依赖项管理
  - 程序集优化
  - 程序集验证
  - 程序集内容提取
  - 原生库绑定生成
  - 性能基准测试

# 限制
limitations:
  - 仅支持.NET程序集
  - 原生库绑定生成功能为模拟实现
  - 大型程序集分析可能需要较长时间
  - 优化功能可能会影响程序集的调试信息

# 配置选项
configuration:
  - name: LINKERS_LOG_LEVEL
    description: 日志级别
    type: string
    default: "INFO"
  - name: LINKERS_CACHE_DIR
    description: 缓存目录
    type: string
    default: "%LOCALAPPDATA%\\Linkers\\Cache"
  - name: LINKERS_TEMP_DIR
    description: 临时目录
    type: string
    default: "%TEMP%\\Linkers"
  - name: LINKERS_MAX_THREADS
    description: 最大线程数
    type: string
    default: "4"

# 兼容性
compatibility:
  - Windows x64
  - Linux x64
  - macOS x64

# 维护状态
maintenance:
  status: active
  last_updated: 2026-01-22
  next_update: 2026-03-22
