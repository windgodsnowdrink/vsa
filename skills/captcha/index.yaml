# captcha Agent Skill - 验证码技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能验证码技能，支持 AOT（提前编译）编译，用于实现各种类型的验证码生成、验证和识别功能
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - SixLabors.ImageSharp@3.1.0
# - CaptchaSharp@1.0.0
# - LazyCaptcha@2.0.0
# - SlideCaptcha@1.5.0
# 应用场景: 网站登录、注册验证、表单提交、API 访问控制、防止机器人攻击等
# 激活条件: 需要验证码生成、验证或识别功能时激活
# 主要功能:
# - 支持多种验证码类型（图片、滑块、点选、短信等）
# - 验证码生成与验证
# - 验证码识别
# - 支持 AOT 编译优化
# - 高性能设计，支持高并发场景
# - 可定制的验证码样式和参数
# - 支持异步编程模型
# 性能特性:
# - 高性能设计，支持高并发场景
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化验证码生成速度
# - AOT 编译优化，提高运行时性能
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程，避免阻塞主线程
# - 高性能算法，优化处理效率
# - 支持多种验证码类型
# - 支持 AOT 编译
# - 与 .NET 生态系统无缝集成
# - 支持自定义验证码生成器
# AOT 编译支持: 支持将验证码应用编译为本机代码，提高运行时性能和启动速度
