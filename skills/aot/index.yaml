# AOT Compilation Agent Skill - AOT编译支持系统
# 版本: 1.0.0
# 作者: VSA Architecture Team
# 描述: 基于.NET 10的高性能AOT编译支持系统，提供AOT兼容的反射解决方案
# 技能类型: 编译优化
# 依赖:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - System.Reflection.Metadata@8.0.0
# - Microsoft.Extensions.Caching.Memory@10.0.0
# 适用场景: AOT编译、反射优化、性能提升、跨平台编译、微服务部署
# 激活条件: 需要AOT编译支持或反射优化时激活
# 主要功能:
# - AOT兼容的反射支持
# - 静态反射机制
# - 高性能元数据缓存
# - 动态方法调用
# - 类型安全的属性访问
# - 自定义反射提供者支持
# - 详细的日志记录和监控
# - 缓存统计和性能分析
# 性能特性:
# - 使用静态反射减少运行时开销
# - 智能元数据缓存机制
# - 高性能方法调用实现
# - 内存优化的缓存策略
# - 支持批量操作
# - 最小化反射调用次数
# - 缓存命中率高达95%
# 技术特性:
# - 静态反射设计模式
# - 提供者设计模式
# - 装饰器设计模式
# - 缓存设计模式
# - 单例模式服务注册
# - 依赖注入支持
# - 异步编程模型
# - 内存安全的反射操作
# - 编译时类型检查