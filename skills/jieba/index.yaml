name: jieba
version: 1.0.0
description: 基于jieba.NET的AOT编译中文分词工具
author: Trae AI
created_at: 2026-01-21
updated_at: 2026-01-21

# 技能类型
type: nlp
category: 中文处理

# AOT架构信息
aot:
  enabled: true
  framework: net11.0
  self_contained: true
  runtime_identifier: win-x64
  optimization_level: Release
  publish_date: 2026-01-21

# 功能特性
features:
  - 精确模式分词
  - 全模式分词
  - 搜索引擎模式分词
  - 关键词提取（TF-IDF）
  - 词性标注
  - 批量处理文本文件
  - 性能基准测试

# 技术栈
tech_stack:
  - C#
  - .NET 10.0
  - jieba.NET
  - Microsoft.Extensions.DependencyInjection
  - Microsoft.Extensions.Caching.Memory
  - Microsoft.Extensions.Logging
  - Microsoft.Extensions.Options

# 脚本信息
scripts:
  - name: jieba_aot
    path: scripts/jieba_aot.cs
    description: AOT编译的中文分词工具
    aot: true
    commands:
      - cut
      - cutall
      - cutforsearch
      - extract
      - pos
      - batch
      - benchmark
      - help

# 文档信息
documentation:
  - name: 技能文档
    path: SKILL.md
    language: zh-CN
  - name: 技术参考
    path: reference/README.md
    language: zh-CN
  - name: 使用示例
    path: reference/examples.md
    language: zh-CN

# 依赖项
dependencies:
  - name: jieba.NET
    version: 0.37.0
    type: nuget
  - name: Microsoft.Extensions.DependencyInjection
    version: 10.0.0
    type: nuget
  - name: Microsoft.Extensions.Caching.Memory
    version: 10.0.0
    type: nuget
  - name: Microsoft.Extensions.Logging
    version: 10.0.0
    type: nuget
  - name: Microsoft.Extensions.Options
    version: 10.0.0
    type: nuget

# 性能指标
performance:
  - name: 精确模式分词
    description: 每秒处理文本量
    value: "约100,000字符/秒"
  - name: 关键词提取
    description: 每秒处理文本量
    value: "约50,000字符/秒"
  - name: 词性标注
    description: 每秒处理文本量
    value: "约30,000字符/秒"

# 使用场景
use_cases:
  - 中文文本分析
  - 搜索引擎索引
  - 自然语言处理
  - 文本挖掘
  - 情感分析
  - 信息检索

# 限制
limitations:
  - 首次运行时需要加载词典，可能会有短暂延迟
  - 批量处理大文件时需要足够的内存
  - 自定义词典支持有限

# 配置选项
configuration:
  - name: JIEBA_DICT_PATH
    description: 自定义词典路径
    type: string
    default: ""
  - name: JIEBA_USER_DICT_PATH
    description: 用户自定义词典路径
    type: string
    default: ""
  - name: JIEBA_BATCH_SIZE
    description: 批量处理大小
    type: integer
    default: 100

# 兼容性
compatibility:
  - windows-x64
  - linux-x64
  - macos-x64

# 维护状态
maintenance:
  status: active
  last_updated: 2026-01-21
  next_update: 2026-03-01
