# iconpython Agent Skill - IconPython 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的 IconPython 技能实现，支持 AOT 编译和高性能 Python 执行
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Options@10.0.0
# - System.Runtime.InteropServices@4.3.0
# - System.Text.Json@8.0.0
# - IronPython@3.4.1
# - Microsoft.Scripting@1.3.4
# 应用场景: Python 脚本执行、表达式计算、REPL 环境、模块管理、基准测试等
# 激活条件: 需要 Python 功能时激活
# 主要功能:
# - Python 脚本执行: 支持执行 Python 脚本文件
# - Python 表达式计算: 支持计算 Python 表达式
# - Python REPL 环境: 提供交互式 Python 环境
# - Python 模块管理: 支持导入和使用 Python 模块
# - 基准测试: 支持 Python 代码性能基准测试
# - IconPython AOT 核心引擎: 基于 AOT 编译的高性能 Python 引擎
# IconPython AOT 架构:
# - iconpython_aot.cs: 核心 IconPython AOT 引擎，实现完整的 Python 执行功能
# - iconpython_aot.setting.json: AOT 编译配置，包含依赖项和运行时选项
# - iconpython_aot.run.json: 运行环境配置，包含不同命令的启动设置
# 性能特性:
# - 高性能设计，支持高并发 Python 代码执行
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - AOT 编译优化，提高启动速度和运行性能
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程，避免阻塞主线程
# - 高性能算法，优化 Python 执行效率
# - 支持 IronPython 集成
# - 支持自定义 Python 模块
# - 支持与其他系统集成
