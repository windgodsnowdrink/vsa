# appinsights Agent Skill - App Insights 监控技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能 Application Insights 监控技能实现
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.ApplicationInsights.AspNetCore@2.22.0
# - Microsoft.ApplicationInsights.WorkerService@2.22.0
# 应用场景: 应用性能监控、遥测数据收集、分析和告警
# 激活条件: 需要 App Insights 功能时激活
# 主要功能:
# - 全面的应用遥测数据收集
# - 实时性能监控和分析
# - 可配置的告警系统
# - Prometheus 集成支持
# - 自定义应用指标收集
# 性能特性:
# - 高性能设计，低开销遥测数据收集
# - 内存优化
# - 并发支持
# - 异步编程模型
# 技术特性:
# - 模块化设计
# - 依赖注入
# - 异步编程
# - 高性能算法
# - 可扩展架构
# - 支持自定义遥测处理器和导出器
