# FluentValidation Agent Skill - FluentValidation 技能
# Version: 1.0.0
# Author: VSA Architecture Team
# Description: 基于 .NET 10 AOT 编译的 FluentValidation 技能实现
# Skill Type: System Function
# Dependencies:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Hosting@10.0.0
# - Microsoft.Extensions.Options@10.0.0
# - FluentValidation@11.10.0
# Application Scenarios: 验证相关功能，如表单验证、模型验证、数据验证等
# Activation Conditions: 当需要验证功能时激活
# Main Features:
# - 对象验证：支持复杂对象的验证，包括必填字段、长度限制、格式验证等
# - 测试模型验证：提供完整的测试模型验证，包括姓名、年龄、邮箱、手机号、密码等字段
# - 详细的验证结果：返回详细的验证错误信息，包括错误字段、错误消息等
# - 高性能设计：AOT 编译优化，减少启动时间和内存占用
# - 易用的命令行接口：支持多种命令别名，方便使用
# - 可配置的选项：通过 Options 模式支持灵活配置
# Performance Features:
# - AOT 编译优化：提前编译为本地代码，减少启动时间
# - 内存优化：减少运行时内存占用
# - 并发支持：异步编程模型，支持高并发操作
# - 性能监控：内置性能计时器，可跟踪验证执行时间
# Technical Features:
# - 模块化设计：清晰的服务接口和实现分离
# - 依赖注入：基于 Microsoft.Extensions.DependencyInjection 的服务管理
# - 异步编程：使用 Task-based 异步模式
# - 选项模式：通过 Microsoft.Extensions.Options 支持配置管理
# - 日志记录：集成 Microsoft.Extensions.Logging
# - 命令行引擎：支持多种命令别名和参数解析
# - 宿主服务：基于 Microsoft.Extensions.Hosting 的应用程序模型
# - FluentValidation 集成：集成最新版本的 FluentValidation 库
