# benchmark Agent Skill - benchmark 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能基准测试技能，提供性能测试、压力测试、负载测试、性能分析等核心功能，支持 AOT 编译优化
# 技能类型: 性能工具
# 依赖项:
# - BenchmarkDotNet@0.14.0
# - BenchmarkDotNet.Annotations@0.14.0
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - System.Memory@4.5.5
# - System.Buffers@4.5.1
# 应用场景: 性能测试、压力测试、负载测试、性能分析、热路径分析、持续性能监控等
# 激活条件: 需要基准测试功能时激活
# 主要功能:
# - 性能基准测试：提供高性能的基准测试框架，支持多种基准测试场景
# - 内存分析：内置内存诊断和分析功能
# - CPU 分析：提供 CPU 使用率和性能计数器分析
# - 并发测试：支持并发和并行基准测试
# - AOT 编译支持：支持将基准测试应用编译为本机代码，提高测试准确性
# - 多框架支持：支持在多个 .NET 框架和运行时上运行基准测试
# - 详细报告生成：生成详细的基准测试报告，包括图表和统计数据
# - 自定义基准测试：支持自定义基准测试场景和配置
# - 性能比较：支持不同实现和算法的性能比较
# - 热路径分析：分析应用程序的热路径和性能瓶颈
# - 持续性能监控：支持持续集成环境中的性能监控
# - 与多种工具集成：支持与各种性能分析工具集成
# 性能特性:
# - 高性能设计，支持高并发基准测试
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化基准测试准确性
# - AOT 编译优化，提高测试准确性
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程，避免阻塞主线程
# - 高性能算法，优化基准测试效率
# - 支持多种基准测试场景
# - 支持 AOT 编译
# - 与 .NET 生态系统无缝集成
# - 支持多种性能分析工具
# AOT 编译支持: 支持将基准测试应用编译为本机代码，提高测试准确性，减少 JIT 编译的影响
