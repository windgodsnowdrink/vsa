name: transport
version: 1.0.0
author: NET 专家
description: 基于 .NET 10 的传输层实现，支持多种传输协议和高性能数据处理技术

compilation:
  options:
    target_framework: net10.0
    publish_aot: true
    trim_mode: partial
    self_contained: true
    publish_single_file: true
    runtime_identifier: win-x64
    output_type: Exe
    nullable: enable
    implicit_usings: enable
    lang_version: preview

  dependencies:
    - name: Microsoft.Extensions.DependencyInjection
      version: 9.0.0
    - name: Microsoft.Extensions.Logging
      version: 9.0.0
    - name: Microsoft.Extensions.Logging.Console
      version: 9.0.0
    - name: Microsoft.Extensions.Options
      version: 9.0.0
    - name: System.CommandLine
      version: 2.0.0-beta4.22272.1
    - name: System.Net.Http
      version: 9.0.0
    - name: System.Net.Sockets
      version: 9.0.0
    - name: System.IO.Pipelines
      version: 9.0.0
    - name: System.Threading.Channels
      version: 9.0.0
    - name: System.Buffers
      version: 9.0.0
    - name: Scrutor
      version: 4.2.2
    - name: System.Reflection.MetadataLoadContext
      version: 9.0.0

features:
  - name: http_transport
    description: HTTP 传输协议支持
    enabled: true
  - name: tcp_transport
    description: TCP 传输协议支持
    enabled: true
  - name: udp_transport
    description: UDP 传输协议支持
    enabled: true
  - name: pipeline_transport
    description: 基于 System.IO.Pipelines 的高性能传输
    enabled: true
  - name: channel_transport
    description: 基于 System.Threading.Channels 的异步传输
    enabled: true
  - name: buffer_management
    description: 基于 System.Buffers 的缓冲区管理
    enabled: true
  - name: dependency_injection
    description: 依赖注入支持
    enabled: true
  - name: scrutor_integration
    description: Scrutor 装饰器模式支持
    enabled: true
  - name: command_line_interface
    description: 命令行接口支持
    enabled: true
  - name: logging
    description: 日志记录支持
    enabled: true
  - name: aot_compilation
    description: AOT 编译支持
    enabled: true

commands:
  - name: transport_core
    description: 核心传输服务
    path: scripts/transport_core.cs
    arguments:
      - name: --transport
        description: 传输类型 (http, tcp, udp, pipeline, channel, buffer)
        required: false
        default: http
      - name: --url
        description: HTTP URL
        required: false
      - name: --method
        description: HTTP 方法 (GET, POST, PUT, DELETE)
        required: false
        default: GET
      - name: --host
        description: TCP/UDP 主机
        required: false
        default: localhost
      - name: --port
        description: TCP/UDP 端口
        required: false
        default: 8080
      - name: --data
        description: 传输数据
        required: false
      - name: --input
        description: 输入文件路径
        required: false
      - name: --output
        description: 输出文件路径
        required: false
      - name: --capacity
        description: 通道容量
        required: false
        default: -1
      - name: --size
        description: 缓冲区大小
        required: false
        default: 4096
      - name: --verbose
        description: 详细输出
        required: false
        default: false

  - name: transport_generator
    description: Scrutor 用法示例
    path: scripts/transport_generator.cs
    arguments:
      - name: --demo
        description: 演示类型 (basic, decorator, filter, lifetime, advanced, scanning, multiple, conditional, all)
        required: false
        default: all
      - name: --assembly
        description: 要扫描的程序集
        required: false
      - name: --pattern
        description: 扫描模式
        required: false
        default: *Service*
      - name: --verbose
        description: 详细输出
        required: false
        default: false

profiles:
  - name: HttpTransport
    description: HTTP 传输配置文件
    command: transport_core
    arguments:
      - --transport
      - http
    environment_variables:
      DOTNET_ENVIRONMENT: Production
      DOTNET_LOGGING_LEVEL: Information
      TRANSPORT_HTTP_TIMEOUT: "30"

  - name: TcpTransport
    description: TCP 传输配置文件
    command: transport_core
    arguments:
      - --transport
      - tcp
    environment_variables:
      DOTNET_ENVIRONMENT: Production
      DOTNET_LOGGING_LEVEL: Information
      TRANSPORT_TCP_BUFFER_SIZE: "8192"

  - name: UdpTransport
    description: UDP 传输配置文件
    command: transport_core
    arguments:
      - --transport
      - udp
    environment_variables:
      DOTNET_ENVIRONMENT: Production
      DOTNET_LOGGING_LEVEL: Information
      TRANSPORT_UDP_BUFFER_SIZE: "8192"

  - name: PipelineTransport
    description: 管道传输配置文件
    command: transport_core
    arguments:
      - --transport
      - pipeline
    environment_variables:
      DOTNET_ENVIRONMENT: Production
      DOTNET_LOGGING_LEVEL: Information
      TRANSPORT_PIPELINE_MIN_SIZE: "512"
      TRANSPORT_PIPELINE_MAX_SIZE: "65536"

  - name: ChannelTransport
    description: 通道传输配置文件
    command: transport_core
    arguments:
      - --transport
      - channel
    environment_variables:
      DOTNET_ENVIRONMENT: Production
      DOTNET_LOGGING_LEVEL: Information
      TRANSPORT_CHANNEL_CAPACITY: "1000"

  - name: BufferTransport
    description: 缓冲区传输配置文件
    command: transport_core
    arguments:
      - --transport
      - buffer
    environment_variables:
      DOTNET_ENVIRONMENT: Production
      DOTNET_LOGGING_LEVEL: Information
      TRANSPORT_BUFFER_POOL_SIZE: "1024"

  - name: ScrutorBasic
    description: Scrutor 基本用法配置文件
    command: transport_generator
    arguments:
      - --demo
      - basic
    environment_variables:
      DOTNET_ENVIRONMENT: Development
      DOTNET_LOGGING_LEVEL: Debug
      SCRUTOR_DEMO_MODE: "true"

  - name: ScrutorDecorator
    description: Scrutor 装饰器模式配置文件
    command: transport_generator
    arguments:
      - --demo
      - decorator
    environment_variables:
      DOTNET_ENVIRONMENT: Development
      DOTNET_LOGGING_LEVEL: Debug
      SCRUTOR_DEMO_MODE: "decorator"
      SCRUTOR_DECORATOR_COUNT: "2"

  - name: ScrutorAll
    description: Scrutor 所有用法配置文件
    command: transport_generator
    arguments:
      - --demo
      - all
    environment_variables:
      DOTNET_ENVIRONMENT: Development
      DOTNET_LOGGING_LEVEL: Information
      SCRUTOR_DEMO_MODE: "true"
      SCRUTOR_ASSEMBLY_SCAN: "true"
      SCRUTOR_DECORATOR_ENABLED: "true"

environment_variables:
  DOTNET_ENVIRONMENT: Production
  DOTNET_LOGGING_LEVEL: Information
  DOTNET_AOT_ENABLED: "true"
  TRANSPORT_HTTP_TIMEOUT: "30"
  TRANSPORT_TCP_BUFFER_SIZE: "8192"
  TRANSPORT_UDP_BUFFER_SIZE: "8192"
  TRANSPORT_PIPELINE_MIN_SIZE: "512"
  TRANSPORT_PIPELINE_MAX_SIZE: "65536"
  TRANSPORT_CHANNEL_CAPACITY: "-1"
  TRANSPORT_BUFFER_POOL_SIZE: "1024"
  SCRUTOR_DEMO_MODE: "false"
  SCRUTOR_ASSEMBLY_SCAN: "false"
  SCRUTOR_DECORATOR_ENABLED: "false"
  SCRUTOR_FILTER_CRITERIA: "Service"
  SCRUTOR_LIFETIME_TEST: "false"
  SCRUTOR_ADVANCED_FEATURES: "false"
  SCRUTOR_SCAN_PATTERN: "*Service*"
  SCRUTOR_DECORATOR_COUNT: "2"
  SCRUTOR_CONDITIONAL_ENABLED: "true"

build:
  configuration: Release
  platform: Any CPU
  output_path: bin/Release/net10.0/win-x64/publish
  publish_profile: Default

debug:
  enabled: true
  port: 49152
  suspend: false

