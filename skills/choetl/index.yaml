# choetl Agent Skill - 高效ETL处理技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能 ETL（提取、转换、加载）处理技能，支持 AOT（提前编译）编译，用于实现高效的数据处理和转换
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Aot@10.0.0
# - ChoETL@1.0.0
# 应用场景: 数据提取、数据转换、数据加载、实时数据处理、批量数据处理、数据集成、数据清洗、数据验证等
# 激活条件: 需要进行 ETL 处理或数据转换时激活
# 主要功能:
# - 多种数据源支持（数据库、文件、API、消息队列等）
# - 高效的数据转换引擎
# - 实时和批量数据处理
# - 数据验证和清洗
# - 分布式 ETL 支持
# - 数据监控和报告
# - 支持 AOT 编译优化
# 性能特性:
# - 高性能设计，支持高并发场景
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化数据处理速度
# - AOT 编译优化，提高运行时性能
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程模型，避免阻塞主线程
# - 高性能算法，优化 ETL 处理效率
# - 支持 AOT 编译
# - 与 .NET 生态系统无缝集成
# - 支持多种数据格式（JSON、CSV、XML、Parquet 等）
# - 支持分布式处理
# - 数据校验和质量控制
# - 实时数据流处理
