# cellreport Agent Skill - 单元格报表技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能 cellreport（单元格报表）技能，支持 AOT（提前编译）编译，用于生成和处理各种格式的报表
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Aot@10.0.0
# 应用场景: 报表生成、数据可视化、数据分析、企业报表系统等
# 激活条件: 需要生成或处理报表时激活
# 主要功能:
# - 基于 .NET 10 的现代化报表生成框架
# - 支持 AOT 编译优化
# - 支持多种报表格式（Excel、PDF、HTML 等）
# - 高性能单元格计算和数据处理
# - 支持复杂报表设计和布局
# - 支持数据源绑定和动态数据填充
# 性能特性:
# - 高性能设计，支持高并发场景
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化报表生成速度
# - AOT 编译优化，提高运行时性能
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程模型，避免阻塞主线程
# - 高性能算法，优化报表处理效率
# - 支持 AOT 编译
# - 与 .NET 生态系统无缝集成
