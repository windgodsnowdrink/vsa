# cache Agent Skill - 缓存技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能缓存技能，支持 AOT（提前编译）编译，提供强大的缓存管理和优化功能
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Caching.Memory@10.0.0
# - StackExchange.Redis@2.8.0
# - EasyCaching@1.10.0
# - FusionCache@1.25.0
# 应用场景: 缓存管理、性能优化、分布式缓存、AOT 编译优化等
# 激活条件: 需要缓存功能时激活
# 主要功能:
# - 内存缓存实现
# - 分布式缓存集成
# - 多级缓存支持
# - 缓存过期策略
# - 缓存预热和刷新
# - 缓存穿透防护
# - 缓存击穿处理
# - 缓存雪崩预防
# - 支持 AOT 编译优化
# - 缓存监控和统计
# 性能特性:
# - 高性能设计，支持高并发场景
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化查询速度
# - AOT 编译优化，提高运行时性能
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程，避免阻塞主线程
# - 高性能算法，优化处理效率
# - 支持多种缓存场景
# - 支持 AOT 编译
# - 与 .NET 生态系统无缝集成
# - 支持多种缓存提供程序
# AOT 编译支持: 支持将缓存应用编译为本机代码，提高运行时性能和启动速度
