# canalsharp Agent Skill - CanalSharp 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能 CanalSharp 客户端技能，支持 AOT（提前编译）编译，用于连接 Canal 服务器，实时捕获 MySQL 数据库变更
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - CanalSharp@2.0.0
# - System.Text.Json@10.0.0
# 应用场景: 数据库变更捕获、实时数据同步、数据仓库同步、缓存更新、事件驱动架构等
# 激活条件: 需要数据库变更捕获或实时数据同步功能时激活
# 主要功能:
# - MySQL 数据库变更实时捕获
# - 支持 Canal 协议 v1.1.4+ 版本
# - 支持多种消息格式（JSON、Protobuf）
# - 支持断点续传
# - 支持集群模式
# - 支持 AOT 编译优化
# - 支持批量处理
# - 支持异步编程模型
# 性能特性:
# - 高性能设计，支持高并发场景
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化消息处理速度
# - AOT 编译优化，提高运行时性能
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程，避免阻塞主线程
# - 高性能算法，优化处理效率
# - 支持多种 Canal 场景
# - 支持 AOT 编译
# - 与 .NET 生态系统无缝集成
# - 支持多种序列化格式
# AOT 编译支持: 支持将 CanalSharp 应用编译为本机代码，提高运行时性能和启动速度
