# Consul AOT Agent Skill - Consul AOT高性能Consul客户端
# Version: 1.0.0
# Author: VSA Architecture Team
# Description: 基于.NET 10 AOT架构的高性能Consul客户端，提供高效、可靠的服务注册与发现、键值存储等功能
# Skill Type: System Function
# Dependencies:
# - Consul@1.7.10.1
# - Microsoft.Extensions.DependencyInjection@10.0.0
