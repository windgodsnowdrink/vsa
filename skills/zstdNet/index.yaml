name: zstdNet
version: 1.0.0
author: zstdNet Team
description: 基于 .NET 10 框架的高性能压缩/解压技能，提供了对 Zstandard (zstd) 压缩算法的完整封装和扩展

# 依赖项
dependencies:
  - name: Microsoft.Extensions.DependencyInjection
    version: 9.0.0
    required: true
  - name: Microsoft.Extensions.Configuration
    version: 9.0.0
    required: true
  - name: Microsoft.Extensions.Options
    version: 9.0.0
    required: true
  - name: System.Memory
    version: 9.0.0
    required: true
  - name: System.Threading.Tasks.Parallel
    version: 9.0.0
    required: false
  - name: Scrutor
    version: 4.0.0
    required: false

# 功能特性
features:
  - name: 高性能压缩/解压
    description: 基于 Zstandard 算法，提供极快的压缩和解压速度
    category: performance
    level: high
  - name: 多级别压缩
    description: 支持从 1 到 19 的压缩级别，满足不同场景需求
    category: functionality
    level: high
  - name: 字典压缩
    description: 支持使用字典进行压缩，进一步提高压缩率
    category: functionality
    level: medium
  - name: 流式处理
    description: 支持大文件的流式压缩和解压
    category: functionality
    level: high
  - name: 内存优化
    description: 使用 Span<T> 和 Memory<T> 进行内存优化
    category: performance
    level: medium
  - name: 多线程处理
    description: 支持多线程并行压缩和解压
    category: performance
    level: high
  - name: 错误处理
    description: 完善的异常处理和错误恢复机制
    category: reliability
    level: medium
  - name: Scrutor 集成
    description: 支持使用 Scrutor 进行自动服务注册和装饰器模式
    category: integration
    level: medium

# 支持的平台
platforms:
  - name: Windows
    versions: ["10", "11", "Server 2019", "Server 2022"]
    supported: true
  - name: Linux
    versions: ["Ubuntu 20.04+", "Debian 10+", "CentOS 7+"]
    supported: true
  - name: macOS
    versions: ["10.15+"]
    supported: true
  - name: .NET Framework
    versions: ["4.8+"]
    supported: false
  - name: .NET Core
    versions: ["3.1+"]
    supported: false
  - name: .NET
    versions: ["6.0+", "7.0+", "8.0+", "9.0+", "10.0+"]
    supported: true

# 安装方法
installation:
  - method: dotnet_cli
    command: dotnet add package zstdNet
    description: 使用 .NET CLI 安装
    supported: true
  - method: nuget_package_manager
    command: Install-Package zstdNet
    description: 使用 NuGet 包管理器安装
    supported: true
  - method: manual_download
    url: https://github.com/zstdNet/zstdNet/releases
    description: 手动下载安装
    supported: true

# 使用示例
examples:
  - name: 基本压缩/解压
    description: 演示如何使用 zstdNet 进行基本的数据压缩和解压
    code: |
      using zstdNet;
      
      // 创建压缩器实例
      var compressor = new ZstdCompressor();
      
      // 压缩数据
      byte[] originalData = Encoding.UTF8.GetBytes("这是一段需要压缩的数据");
      byte[] compressedData = await compressor.CompressAsync(originalData);
      Console.WriteLine($"原始大小: {originalData.Length} 字节");
      Console.WriteLine($"压缩大小: {compressedData.Length} 字节");
      Console.WriteLine($"压缩率: {(float)compressedData.Length / originalData.Length:P2}");
      
      // 解压数据
      var decompressor = new ZstdDecompressor();
      byte[] decompressedData = await decompressor.DecompressAsync(compressedData);
      string result = Encoding.UTF8.GetString(decompressedData);
      Console.WriteLine($"解压结果: {result}");
  - name: 文件压缩/解压
    description: 演示如何使用 zstdNet 进行文件的压缩和解压
    code: |
      using zstdNet;
      
      // 文件压缩
      var fileCompressor = new ZstdFileCompressor();
      await fileCompressor.CompressFileAsync("input.txt", "output.txt.zst");
      
      // 文件解压
      var fileDecompressor = new ZstdFileDecompressor();
      await fileDecompressor.DecompressFileAsync("output.txt.zst", "output.txt");
  - name: 流式处理
    description: 演示如何使用 zstdNet 进行流式压缩和解压
    code: |
      using zstdNet;
      
      // 流式压缩
      using (var inputStream = File.OpenRead("largefile.bin"))
      using (var outputStream = File.Create("largefile.bin.zst"))
      using (var compressionStream = new ZstdCompressionStream(outputStream))
      {
          await inputStream.CopyToAsync(compressionStream);
      }
      
      // 流式解压
      using (var inputStream = File.OpenRead("largefile.bin.zst"))
      using (var outputStream = File.Create("largefile.bin"))
      using (var decompressionStream = new ZstdDecompressionStream(inputStream))
      {
          await decompressionStream.CopyToAsync(outputStream);
      }
  - name: 字典压缩
    description: 演示如何使用 zstdNet 进行字典压缩
    code: |
      using zstdNet;
      
      // 创建字典
      var dictionaryBuilder = new ZstdDictionaryBuilder();
      byte[] dictionary = await dictionaryBuilder.BuildFromFilesAsync(new[] { "sample1.txt", "sample2.txt" });
      
      // 使用字典压缩
      var compressor = new ZstdCompressor(new ZstdOptions { UseDictionary = true, DictionaryData = dictionary });
      byte[] compressedData = await compressor.CompressAsync(data);
      
      // 使用字典解压
      var decompressor = new ZstdDecompressor(new ZstdOptions { UseDictionary = true, DictionaryData = dictionary });
      byte[] decompressedData = await decompressor.DecompressAsync(compressedData);

# 配置选项
configuration:
  - name: CompressionLevel
    type: int
    default: 3
    description: 压缩级别，范围 1-19
    required: false
  - name: BufferSize
    type: int
    default: 8192
    description: 缓冲区大小（字节）
    required: false
  - name: UseDictionary
    type: bool
    default: false
    description: 是否使用字典压缩
    required: false
  - name: DictionaryPath
    type: string
    default: null
    description: 字典文件路径
    required: false
  - name: DictionaryData
    type: byte[]
    default: null
    description: 字典数据
    required: false
  - name: EnableParallelCompression
    type: bool
    default: true
    description: 是否启用并行压缩
    required: false
  - name: MaxDegreeOfParallelism
    type: int
    default: Environment.ProcessorCount
    description: 最大并行度
    required: false

# 性能特性
performance:
  - metric: compression_speed
    unit: MB/s
    values:
      - level: 1
        speed: 500+
      - level: 3
        speed: 300+
      - level: 5
        speed: 200+
      - level: 10
        speed: 50+
      - level: 15
        speed: 10+
      - level: 19
        speed: 1+
  - metric: decompression_speed
    unit: MB/s
    values:
      - level: 1
        speed: 1500+
      - level: 3
        speed: 1500+
      - level: 5
        speed: 1400+
      - level: 10
        speed: 1200+
      - level: 15
        speed: 1000+
      - level: 19
        speed: 800+
  - metric: compression_ratio
    unit: %
    values:
      - level: 1
        ratio: 50-60
      - level: 3
        ratio: 40-50
      - level: 5
        ratio: 35-40
      - level: 10
        ratio: 25-30
      - level: 15
        ratio: 20-25
      - level: 19
        ratio: 15-20
  - metric: memory_usage
    unit: MB
    values:
      - scenario: small_data
        usage: 1-2
      - scenario: medium_data
        usage: 5-10
      - scenario: large_data
        usage: up_to_100

