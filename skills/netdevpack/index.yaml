# NetDevPack Agent Skill - NetDevPack 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的 NetDevPack 技能实现，提供高性能的开发工具包功能
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Options@10.0.0
# - Microsoft.Extensions.Caching.Memory@10.0.0
# 应用场景:
# - 企业级应用开发
# - 微服务架构
# - 高性能 Web 应用
# - 数据处理系统
# 激活条件: 当需要 NetDevPack 开发工具包功能时激活
# 主要功能:
# - 依赖注入增强：提供更强大的依赖注入功能
# - 缓存管理：高性能缓存管理，支持内存缓存和分布式缓存
# - 事件总线：轻量级事件总线，支持发布/订阅模式
# - 对象映射：高性能对象映射，支持复杂对象转换
# - 验证工具：强大的验证工具，支持数据验证和业务规则验证
# 性能特性:
# - 高吞吐量：使用通道和批处理技术，支持高并发处理
# - 低延迟：使用 Span 和零拷贝技术，减少内存分配和拷贝
# - 内存优化：使用内存池和对象池，减少 GC 压力
# - 可扩展性：支持水平扩展，适用于大规模应用
# 技术特性:
# - 模块化设计：清晰的模块划分，易于扩展和维护
# - 依赖注入：使用 .NET 内置的依赖注入系统
# - 异步编程：全面支持异步操作，提高系统吞吐量
# - 高性能算法：使用高效的算法和数据结构
# - 跨平台支持：支持 Windows、Linux 和 macOS
# 安全特性:
# - 数据验证：内置数据验证机制，确保数据安全
# - 错误处理：完善的错误处理机制，提高系统稳定性
# - 日志记录：详细的日志记录，便于安全审计
# 部署特性:
# - 容器化支持：支持 Docker 容器部署
# - 云平台兼容：兼容主流云平台
# - AOT 编译：支持 Ahead-of-Time 编译，提高运行时性能
# AOT 编译选项:
# - PublishAot=true
# - ReadyToRun=true
# - TieredCompilation=true
# 支持的运行时:
# - win-x64
# - linux-x64
# - osx-x64
# - linux-arm64
# - osx-arm64
