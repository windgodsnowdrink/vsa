name: kafka
version: 1.0.0
description: 基于Confluent.Kafka的AOT编译Kafka工具
author: Trae AI
created_at: 2026-01-21
updated_at: 2026-01-21

# 技能类型
type: messaging
category: 消息队列

# AOT架构信息
aot:
  enabled: true
  framework: net10.0
  self_contained: true
  runtime_identifier: win-x64
  optimization_level: Release
  publish_date: 2026-01-21

# 功能特性
features:
  - 消息发送和消费
  - 主题管理（列出、创建、删除、描述）
  - 批量消息发送
  - 性能基准测试
  - 命令行接口
  - 命令别名支持
  - 详细的日志记录

# 技术栈
tech_stack:
  - C#
  - .NET 10.0
  - Confluent.Kafka
  - Microsoft.Extensions.DependencyInjection
  - Microsoft.Extensions.Caching.Memory
  - Microsoft.Extensions.Logging
  - Microsoft.Extensions.Options

# 脚本信息
scripts:
  - name: kafka_aot
    path: scripts/kafka_aot.cs
    description: AOT编译的Kafka工具
    aot: true
    commands:
      - produce
      - consume
      - list-topics
      - create-topic
      - delete-topic
      - describe-topic
      - batch-produce
      - benchmark
      - help

# 文档信息
documentation:
  - name: 技能文档
    path: SKILL.md
    language: zh-CN
  - name: 技术参考
    path: reference/README.md
    language: zh-CN
  - name: 使用示例
    path: reference/examples.md
    language: zh-CN

# 依赖项
dependencies:
  - name: Confluent.Kafka
    version: 2.3.0
    type: nuget
  - name: Microsoft.Extensions.DependencyInjection
    version: 10.0.0
    type: nuget
  - name: Microsoft.Extensions.Caching.Memory
    version: 10.0.0
    type: nuget
  - name: Microsoft.Extensions.Logging
    version: 10.0.0
    type: nuget
  - name: Microsoft.Extensions.Options
    version: 10.0.0
    type: nuget

# 性能指标
performance:
  - name: 消息发送速度
    description: 每秒发送消息数量
    value: "约10,000条/秒"
  - name: 消息消费速度
    description: 每秒消费消息数量
    value: "约15,000条/秒"
  - name: 批量发送速度
    description: 每秒批量发送消息数量
    value: "约20,000条/秒"
  - name: 主题操作响应时间
    description: 主题创建/删除/描述操作的平均响应时间
    value: "约500ms"

# 使用场景
use_cases:
  - 消息队列管理
  - 数据流处理
  - 事件驱动架构
  - 微服务间通信
  - 日志收集和处理
  - 数据集成和ETL
  - 实时数据分析
  - 系统解耦

# 限制
limitations:
  - 需要Kafka集群运行
  - 网络连接稳定性要求较高
  - 批量操作时内存使用较大
  - 性能测试可能对Kafka集群造成压力
  - 仅支持字符串消息格式

# 配置选项
configuration:
  - name: KAFKA_CLIENT_ID
    description: Kafka客户端ID
    type: string
    default: "kafka_aot_client"
  - name: KAFKA_PRODUCER_ACKS
    description: 生产者确认级别
    type: string
    default: "1"
  - name: KAFKA_CONSUMER_AUTO_OFFSET_RESET
    description: 消费者自动偏移重置策略
    type: string
    default: "earliest"
  - name: KAFKA_PRODUCER_LINGER_MS
    description: 生产者 linger 时间（毫秒）
    type: integer
    default: 10
  - name: KAFKA_PRODUCER_BATCH_SIZE
    description: 生产者批量大小
    type: integer
    default: 16384

# 兼容性
compatibility:
  - kafka_2.0.0+
  - confluent_kafka_2.0.0+
  - windows-x64
  - linux-x64
  - macos-x64

# 维护状态
maintenance:
  status: active
  last_updated: 2026-01-21
  next_update: 2026-03-01
