# chaos Agent Skill - 混沌测试技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能混沌测试技能，支持 AOT（提前编译）编译，用于实现混沌工程和故障注入
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Aot@10.0.0
# 应用场景: 混沌工程、故障注入、系统弹性测试、可靠性测试、分布式系统测试等
# 激活条件: 需要进行混沌测试或故障注入时激活
# 主要功能:
# - 多种故障类型支持（延迟、中断、异常、资源耗尽等）
# - 精细的故障注入控制
# - 混沌测试场景管理
# - 实时监控和报告
# - 与分布式系统无缝集成
# - 支持 AOT 编译优化
# 性能特性:
# - 高性能设计，支持高并发场景
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化故障注入响应速度
# - AOT 编译优化，提高运行时性能
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程模型，避免阻塞主线程
# - 高性能算法，优化混沌测试效率
# - 支持 AOT 编译
# - 与 .NET 生态系统无缝集成
# - 支持多种分布式系统架构
# AOT 编译支持: 支持将混沌测试应用编译为本机代码，提高运行时性能和启动速度
