# charts Agent Skill - 图表生成技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能图表生成技能，支持 AOT（提前编译）编译，用于生成各种类型的图表
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Aot@10.0.0
# 应用场景: 数据可视化、图表生成、报表展示、数据分析、仪表盘设计等
# 激活条件: 需要生成图表或进行数据可视化时激活
# 主要功能:
# - 支持多种图表类型（折线图、柱状图、饼图、散点图、地图等）
# - 高性能图表生成
# - 自定义图表样式和主题
# - 支持多种数据源
# - 图表导出功能
# - 响应式设计，适配不同屏幕尺寸
# - 支持 AOT 编译优化
# 性能特性:
# - 高性能设计，支持高并发场景
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化图表生成速度
# - AOT 编译优化，提高运行时性能
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程模型，避免阻塞主线程
# - 高性能算法，优化图表生成效率
# - 支持 AOT 编译
# - 与 .NET 生态系统无缝集成
# - 支持多种前端图表库集成（ECharts、Highcharts 等）
# - 支持多种数据格式
