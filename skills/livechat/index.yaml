# livechat 智能体技能 - livechat 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的实时聊天技能实现
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - LiveChatSDK@11.0.0
# - System.Threading.Channels@8.0.0
# - Microsoft.Extensions.ObjectPool@8.0.0
# - Microsoft.AspNetCore.SignalR@8.0.0
# 应用场景: 实时聊天相关功能
# 激活条件: 当需要实时聊天功能时激活
# 主要功能:
# - 实时视频处理
# - 实时音频处理
# - 实时消息传递
# - 高性能设计
# - 易于使用的 API
# - 可扩展架构
# 性能特性:
# - 高性能设计
# - 内存优化
# - 并发支持
# - 低延迟处理
# 技术特性:
# - 模块化设计
# - 依赖注入
# - 异步编程
# - 高性能算法
# - AOT 编译支持
# - Threading.Channels 事件处理
# - Span 零拷贝优化
# AOT 配置:
# - PublishAot: true
# - IncludeNativeLibrariesForSelfExtract: true
# - EnableCppCodeGen: true
# - PublishSingleFile: true
# - SelfContained: true
# - RuntimeIdentifier: win-x64
# 执行脚本:
# - 脚本路径: scripts/livechat_integration.cs
# - 运行配置: scripts/livechat_integration.run.json
# - 设置文件: scripts/livechat_integration.setting.json
# 执行流程:
# 1. 编译: dotnet publish scripts/livechat_integration.cs -c Release -r win-x64 --aot
# 2. 部署: 将生成的可执行文件部署到目标环境
# 3. 运行: 执行可执行文件，启动 livechat 服务
# 4. 集成: 与主应用集成，使用 livechat 功能
# Channel 事件处理:
# - 视频流处理: 使用 Channel 实现高效的视频帧处理
# - 音频流处理: 使用 Channel 实现低延迟的音频帧处理
# - 消息传递: 使用 Channel 实现高并发的消息传递
# 内存优化:
# - Span 零拷贝: 减少内存分配和复制
# - 对象池: 减少对象创建开销
# - 内存池: 优化内存使用
# 跨平台支持:
# - Windows: win-x64
# - Linux: linux-x64
# - macOS: osx-x64
