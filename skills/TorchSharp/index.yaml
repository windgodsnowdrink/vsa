id: torchsharp
title: TorchSharp 深度学习技能
description: 基于 TorchSharp 的深度学习技能，支持 AOT 编译和高性能推理
author: NET 专家
version: 1.0.0
category: 深度学习

# AOT 编译配置
compilation:
  target_framework: net10.0
  publish_aot: true
  trim_mode: partial
  self_contained: true
  publish_single_file: true
  runtime_identifier: win-x64
  additional_options: -p:UseAppHost=true

# 依赖项
dependencies:
  - name: TorchSharp
    version: 0.100.0-preview.1
  - name: Scrutor
    version: 4.0.0
  - name: System.CommandLine
    version: 2.0.0
  - name: Microsoft.Extensions.DependencyInjection
    version: 10.0.0
  - name: Microsoft.Extensions.Logging
    version: 10.0.0
  - name: Microsoft.Extensions.Caching.Memory
    version: 10.0.0
  - name: System.IO.Abstractions
    version: 19.2.0
  - name: Newtonsoft.Json
    version: 13.0.3
  - name: Microsoft.ML
    version: 3.0.0
  - name: OpenCVSharp4
    version: 4.9.0

# 功能特性
features:
  - name: 张量操作
    description: 支持创建、操作和转换张量
  - name: 模型训练
    description: 支持模型训练和优化
  - name: 模型推理
    description: 支持模型加载和推理
  - name: 图像处理
    description: 支持图像预处理和后处理
  - name: Scrutor 集成
    description: 支持高级服务注册和装饰模式

# CLI 命令
commands:
  - name: tensor
    description: 执行张量操作
    arguments:
      - name: operation
        description: 张量操作类型
        required: true
      - name: shape
        description: 张量形状
        required: false
  - name: model
    description: 执行模型操作
    arguments:
      - name: operation
        description: 模型操作类型
        required: true
      - name: model_path
        description: 模型路径
        required: false
  - name: image
    description: 执行图像处理
    arguments:
      - name: operation
        description: 图像处理操作类型
        required: true
      - name: image_path
        description: 图像路径
        required: false
  - name: scrutor
    description: 执行 Scrutor 演示
    arguments:
      - name: demo
        description: Scrutor 演示类型
        required: true

# 文件路径
files:
  - path: scripts/torchsharp_core.cs
    description: TorchSharp 核心实现
  - path: scripts/torchsharp_core.setting.json
    description: TorchSharp 核心编译配置
  - path: scripts/torchsharp_core.run.json
    description: TorchSharp 核心运行配置
  - path: scripts/torchsharp_generator.cs
    description: Scrutor 用法示例
  - path: scripts/torchsharp_generator.setting.json
    description: Scrutor 演示编译配置
  - path: scripts/torchsharp_generator.run.json
    description: Scrutor 演示运行配置
  - path: reference/README.md
    description: 参考文档
  - path: reference/examples.md
    description: 使用示例文档
