# auth Agent Skill - auth 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能认证授权技能，提供身份验证、授权管理、单点登录、权限控制等核心功能
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.AspNetCore.Authentication.JwtBearer@10.0.0
# - Microsoft.AspNetCore.Authorization@10.0.0
# - System.IdentityModel.Tokens.Jwt@7.0.0
# 应用场景: 身份验证、授权管理、单点登录、API 保护、权限控制等
# 激活条件: 需要认证授权功能时激活
# 主要功能:
# - 身份验证：支持多种身份验证方式，包括 JWT、OAuth 2.0、OpenID Connect 等
# - 授权管理：支持基于角色的访问控制（RBAC）和基于属性的访问控制（ABAC）
# - 单点登录 (SSO)：支持多种 SSO 解决方案集成
# - 权限控制：细粒度的权限管理和访问控制
# - 令牌管理：支持 JWT 令牌的生成、验证和刷新
# - 多因素认证：支持多种多因素认证方式
# - API 保护：提供 API 保护和授权机制
# - AOT 编译优化：支持将认证应用编译为本机代码，提高启动速度和运行性能
# 性能特性:
# - 高性能设计，支持高并发场景
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化认证授权处理延迟
# - AOT 编译优化，提高启动速度和运行性能
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程，避免阻塞主线程
# - 高性能算法，优化认证授权处理效率
# - 支持多种认证协议和标准
# - 可扩展架构，支持自定义扩展
# - 与多种框架集成
# AOT 编译支持: 支持将认证应用编译为本机代码，提高启动速度和运行性能
