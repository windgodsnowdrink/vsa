# Nacos 智能体技能 - Nacos 服务发现与配置管理
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能 Nacos 技能实现，采用 AOT 编译优化，支持服务注册与发现、配置中心、服务健康检查等核心功能
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Options@10.0.0
# - Microsoft.Extensions.Caching.Memory@10.0.0
# - nacos-sdk-csharp@1.3.5
# 应用场景: 微服务架构、服务发现、配置中心、服务健康检查、动态配置管理、集群管理
# 激活条件: 需要服务发现或配置管理功能时激活
# 主要功能:
# - 服务注册与发现：支持服务的注册、发现和健康检查
# - 配置中心：提供集中式配置管理，支持配置的动态更新和监听
# - 命名空间管理：支持多命名空间，实现环境隔离
# - 集群管理：支持 Nacos 集群的高可用配置
# - 服务路由：支持基于权重的服务路由和负载均衡
# - 健康检查：支持服务实例的健康检查和自动剔除
# - 配置版本管理：支持配置的版本控制和回滚
# - 高性能设计：采用 AOT 编译优化，提供高性能的服务操作
# - 可扩展架构：支持自定义扩展，适应不同业务场景的需求
# 性能特性:
# - 高性能设计，支持高并发服务操作
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化服务操作延迟
# - 智能缓存机制，提高频繁操作的响应速度
# - 批量操作支持，减少网络往返
# - 服务发现缓存，提高服务发现速度
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程，避免阻塞主线程
# - 高性能算法，优化服务操作效率
# - 零拷贝技术，减少内存拷贝开销
# - 事件驱动，实现配置变更的实时通知
# - AOT 编译优化，提高运行时性能
# - 跨平台支持，适用于不同运行环境
# 安全特性:
# - 支持 Nacos 服务器的身份认证
# - 配置加密，保护敏感配置信息
# - 访问控制，确保只有授权服务可以注册和发现
# - 审计日志，记录服务操作历史
# 部署特性:
# - 支持容器化部署
# - 支持微服务架构
# - 支持无服务器部署
# - 支持边缘计算场景

#:property PublishAot=true
#:property IncludeNativeLibrariesForSelfExtract=true
#:property EnableCppCodeGen=true
#:property PublishSingleFile=true
#:property SelfContained=true
#:property RuntimeIdentifier=win-x64
#:property RuntimeIdentifier=linux-x64
#:property RuntimeIdentifier=osx-x64
