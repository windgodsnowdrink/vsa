# NATS Agent Skill - NATS 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的 NATS 技能实现，提供高性能的消息发布与订阅功能
# 技能类型: 系统功能
# 依赖项:
# - csharp-nats@2.0.0
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Options@10.0.0
# 应用场景:
# - 微服务架构中的服务间通信
# - 事件驱动架构中的事件发布与订阅
# - 实时数据处理和流处理
# - 分布式系统中的消息传递
# 激活条件: 当需要 NATS 消息系统功能时激活
# 主要功能:
# - 消息发布与订阅：支持高性能的消息发布和订阅功能
# - 连接管理：自动重连、连接状态监控和管理
# - 消息队列：支持消息队列功能，确保消息可靠传递
# - 高性能设计：使用 Span 优化、内存池、通道和零拷贝技术
# - 易于使用的 API：简单直观的 API 设计，支持异步操作
# 性能特性:
# - 高吞吐量：使用通道和批处理技术，支持高并发消息处理
# - 低延迟：使用 Span 和零拷贝技术，减少内存分配和拷贝
# - 内存优化：使用内存池和对象池，减少 GC 压力
# - 可扩展性：支持水平扩展，适用于大规模应用
# 技术特性:
# - 模块化设计：清晰的模块划分，易于扩展和维护
# - 依赖注入：使用 .NET 内置的依赖注入系统
# - 异步编程：全面支持异步操作，提高系统吞吐量
# - 高性能算法：使用高效的算法和数据结构
# - 跨平台支持：支持 Windows、Linux 和 macOS
# 安全特性:
# - 连接认证：支持 NATS 服务器的认证机制
# - 消息加密：支持消息加密传输
# - 访问控制：支持基于主题的访问控制
# 部署特性:
# - 容器化支持：支持 Docker 容器部署
# - 云平台兼容：兼容主流云平台
# - AOT 编译：支持 Ahead-of-Time 编译，提高运行时性能
# AOT 编译选项:
# - PublishAot=true
# - ReadyToRun=true
# - TieredCompilation=true
# 支持的运行时:
# - win-x64
# - linux-x64
# - osx-x64
# - linux-arm64
# - osx-arm64
