# Dataflow AOT Agent Skill - Dataflow AOT高性能数据流处理
# 版本: 1.0.0
# 作者: VSA Architecture Team
# 描述: 基于.NET 10 AOT架构的高性能Dataflow数据流处理技能，为.NET开发者提供强大、高效的数据处理能力，支持简单数据流、批处理数据流、复杂多步骤数据流和高性能管道处理等核心功能
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - Microsoft.Extensions.Hosting@10.0.0
# - Microsoft.Extensions.Options@10.0.0
# - System.Threading.Tasks.Dataflow@9.0.0
# 应用场景:
# - 数据处理管道
# - 批处理作业
# - 实时数据处理
# - ETL过程
# - 图像处理
# - 文本处理
# - 机器学习
# - 科学计算
# - Web服务后端
# - 微服务架构
# 激活条件: 当需要使用数据流处理功能时激活
# 主要功能:
# - 简单数据流处理：支持基本的单步骤数据流转换，可配置并行度
# - 批处理数据流：支持按批次处理数据，提高处理效率
# - 复杂多步骤数据流：支持多阶段数据流处理，每阶段可配置不同的并行度
# - 高性能管道处理：支持构建可扩展的管道处理流程
# - 背压机制：内置背压支持，防止系统过载
# - 性能监控：内置性能指标收集和监控
# 性能特性:
# - .NET 10 AOT编译，提供原生性能
# - 低启动时间和内存占用
# - 高并发处理能力
# - 优化的数据流处理算法
# - 内置背压机制，防止系统过载
# 技术特性:
# - 模块化设计
# - 依赖注入
# - 选项模式
# - 异步编程
# - 详细日志记录
# - 命令行接口
# - 灵活配置选项
# - 高性能数据流算法
# - 内置性能监控
