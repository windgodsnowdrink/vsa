# bogus Agent Skill - bogus 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能 Bogus 模拟数据生成技能，支持 AOT 编译优化
# 技能类型: 系统功能
# 依赖项:
# - Bogus@35.1.2
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - System.Text.Json@10.0.0
# 应用场景: 模拟数据生成、测试数据生成、演示数据生成、性能测试数据生成等
# 激活条件: 需要 Bogus 模拟数据功能时激活
# 主要功能:
# - 高性能模拟数据生成
# - 支持多种数据类型（字符串、数字、日期、GUID等）
# - 支持自定义数据模板
# - 支持批量数据生成
# - 支持 AOT 编译优化
# - 支持多种数据格式输出
# - 支持多语言数据生成
# - 支持关联数据生成
# 性能特性:
# - 高性能设计，支持高并发数据生成
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化数据生成速度
# - AOT 编译优化，提高数据生成性能
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程，避免阻塞主线程
# - 高性能算法，优化数据生成效率
# - 支持多种数据生成场景
# - 支持 AOT 编译
# - 与 .NET 生态系统无缝集成
# - 支持多种数据输出格式
# AOT 编译支持: 支持将 Bogus 模拟数据生成应用编译为本机代码，提高数据生成性能和启动速度
