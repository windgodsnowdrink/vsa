# http Agent Skill - HTTP 客户端和服务器技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的高性能 HTTP 客户端和服务器技能实现，支持 AOT 编译和完整的 HTTP AOT 架构
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - System.Net.Http.Json@10.0.0
# - Microsoft.AspNetCore.Http.Abstractions@10.0.0
# - Polly@8.3.1
# - Microsoft.Extensions.Http.Polly@10.0.0
# - System.Text.Json@8.0.0
# - Refit@7.0.0
# - RestSharp@108.0.3
# 应用场景: HTTP 客户端开发、HTTP 服务器开发、API 集成、微服务通信、Webhook 集成等
# 激活条件: 需要 HTTP 功能时激活
# 主要功能:
# - HTTP 客户端（支持 HTTP/1.1、HTTP/2 和 HTTP/3）
# - HTTP 服务器（基于 ASP.NET Core 10）
# - HTTP/3 和 QUIC 支持
# - HTTP 弹性（重试、断路器、超时、舱壁隔离）
# - HTTP 报告（Prometheus、OpenTelemetry、告警）
# - 安全头配置和管理
# - AntiXSS 防护
# - 数据保护
# - WebApiClientCore 集成（AOT 兼容）
# - HATEOAS 支持
# - Webhook 集成
# - HTTP REPL 工具
# - HTTP AOT 核心引擎（支持多 HTTP 方法、弹性策略、基准测试等）
# AOT 编译支持: 支持将 HTTP 应用编译为本机代码，提高启动速度和运行性能
# HTTP AOT 架构:
# - http_aot.cs: 核心 HTTP AOT 引擎，实现完整的 HTTP 客户端功能
# - http_aot.setting.json: AOT 编译配置，包含依赖项和运行时选项
# - http_aot.run.json: 运行环境配置，包含不同命令的启动设置
# 性能特性:
# - 高性能设计，支持高并发 HTTP 请求处理
# - 内存优化，减少内存占用和拷贝
# - 并发支持，充分利用多核 CPU
# - 低延迟设计，优化 HTTP 请求和响应延迟
# - AOT 编译优化，提高启动速度和运行性能
# 技术特性:
# - 模块化设计，便于扩展和维护
# - 依赖注入，提高代码的可测试性
# - 异步编程，避免阻塞主线程
# - 高性能算法，优化 HTTP 处理效率
# - 零拷贝技术，减少内存拷贝开销
# - 源生成器，减少运行时反射
# - 支持多种 HTTP 协议版本（HTTP/1.1、HTTP/2、HTTP/3）
# - 支持多种 HTTP 客户端库（WebApiClientCore、Refit、RestSharp）
# - 支持弹性策略
# - 支持安全头和 AntiXSS 防护
# - 支持 AOT 编译，提高应用性能
