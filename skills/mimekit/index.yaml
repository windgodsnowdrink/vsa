# Skill Type: 系统功能
# Dependencies:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - MimeKit@4.0.0
# - MailKit@4.0.0
# Application Scenarios: 邮件解析、邮件构建、邮件发送、邮件附件处理等
# Activation Conditions: 当需要使用邮件处理功能时激活
# Main Features:
# - 邮件解析
# - 邮件构建
# - 邮件发送
# - 邮件附件处理
# - 邮件加密/解密
# - 邮件签名/验证
# Performance Features:
# - 高性能设计
# - 内存优化
# - 并发支持
# - 批处理
# Technical Features:
# - 模块化设计
# - 依赖注入
# - 异步编程
# - 高性能算法
# - AOT 编译优化
