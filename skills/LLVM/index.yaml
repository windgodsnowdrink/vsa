# LLVM 智能体技能 - LLVM 技能
# 版本: 1.0.0
# 作者: VSA 架构团队
# 描述: 基于 .NET 10 的 LLVM 技能实现
# 技能类型: 系统功能
# 依赖项:
# - Microsoft.Extensions.DependencyInjection@10.0.0
# - Microsoft.Extensions.Logging@10.0.0
# - LLVMSharp@16.0.0
# - System.Threading.Channels@8.0.0
# - Microsoft.Extensions.ObjectPool@8.0.0
# 应用场景: LLVM 相关功能
# 激活条件: 当需要 LLVM 功能时激活
# 主要功能:
# - IR 优化
# - 代码生成
# - 状态机编译
# - 高性能设计
# - 易于使用的 API
# - 可扩展架构
# 性能特性:
# - 高性能设计
# - 内存优化
# - 并发支持
# - 低延迟处理
# 技术特性:
# - 模块化设计
# - 依赖注入
# - 异步编程
# - 高性能算法
# - AOT 编译支持
# - Threading.Channels 事件处理
# - Span 零拷贝优化
# AOT 配置:
# - PublishAot: true
# - IncludeNativeLibrariesForSelfExtract: true
# - EnableCppCodeGen: true
# - PublishSingleFile: true
# - SelfContained: true
# - RuntimeIdentifier: win-x64
# 执行脚本:
# - 脚本路径: scripts/llvm_ir_optimizer.cs
# - 运行配置: scripts/llvm_ir_optimizer.run.json
# - 设置文件: scripts/llvm_ir_optimizer.setting.json
# 执行流程:
# 1. 编译: dotnet publish scripts/llvm_ir_optimizer.cs -c Release -r win-x64 --aot
# 2. 部署: 将生成的可执行文件部署到目标环境
# 3. 运行: 执行可执行文件，启动 LLVM 服务
# 4. 集成: 与主应用集成，使用 LLVM 功能
# Channel 事件处理:
# - IR 优化请求: 使用 Channel 实现高效的优化请求队列
# - 代码生成: 使用 Channel 实现高效的代码生成处理
# - 状态机编译: 使用 Channel 实现高效的状态机编译
# 内存优化:
# - Span 零拷贝: 减少内存分配和复制
# - 对象池: 减少对象创建开销
# - 内存池: 优化内存使用
# 跨平台支持:
# - Windows: win-x64
# - Linux: linux-x64
# - macOS: osx-x64
