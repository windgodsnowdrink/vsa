# PLC·AIOT SaaS 本地开发基础设施（V1-now MQTT 桥验证用）
# 启动： docker compose up -d
# 停止： docker compose down
# 数据库：本地 SQL Server，Windows 账户登录（Integrated Security=True）。
#   不再随容器起 PostgreSQL；appsettings 连接串 Server=localhost;Integrated Security=True。
#   需本机已安装 SQL Server（默认实例）并以当前 Windows 账户登录。
# EMQX 控制台:  http://localhost:18083   admin / Admin123

services:
  emqx:
    image: emqx/emqx:5.8.5
    container_name: plc-saas-emqx
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: Admin123
      EMQX_NODE__NAME: emqx@127.0.0.1
      # 允许 EMQX 规则引擎 Webhook 用自签/HTTP 访问本机 SaaS（dev）
      EMQX_RULE_ENGINE__HTTP__CONNECT_TIMEOUT: 5s
    ports:
      - "1883:1883"   # MQTT
      - "8083:8083"   # MQTT over WebSocket
      - "8084:8084"   # MQTT over WSS
      - "8883:8883"   # MQTT/SSL
      - "18083:18083" # Dashboard + REST API
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
