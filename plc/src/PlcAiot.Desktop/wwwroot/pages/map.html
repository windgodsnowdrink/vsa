    <style id="theme-vars">
/*
 * PLC·AIOT Design Tokens
 * Reference: Apple Design Library (restrained, precise, editorial)
 * Domain: Industrial IoT / PLC Edge Device SaaS
 * Primary: Tech sky blue (#0ea5e9) with glassmorphism surfaces
 * Theme modes: light / dark
 */

:root {
  /* Primitive — brand sky */
  --plca-brand-50: #f0f9ff;
  --plca-brand-100: #e0f2fe;
  --plca-brand-200: #bae6fd;
  --plca-brand-300: #7dd3fc;
  --plca-brand-400: #38bdf8;
  --plca-brand-500: #0ea5e9;
  --plca-brand-600: #0284c7;
  --plca-brand-700: #0369a1;
  --plca-brand-800: #075985;
  --plca-brand-900: #0c4a6e;

  /* Primitive — slate neutrals */
  --plca-slate-50: #f8fafc;
  --plca-slate-100: #f1f5f9;
  --plca-slate-200: #e2e8f0;
  --plca-slate-300: #cbd5e1;
  --plca-slate-400: #94a3b8;
  --plca-slate-500: #64748b;
  --plca-slate-600: #475569;
  --plca-slate-700: #334155;
  --plca-slate-800: #1e293b;
  --plca-slate-900: #0f172a;

  /* Primitive — semantic scales */
  --plca-background: var(--plca-slate-50);
  --plca-foreground: var(--plca-slate-900);
  --plca-card: rgba(255, 255, 255, 0.78);
  --plca-card-foreground: var(--plca-slate-900);
  --plca-popover: #ffffff;
  --plca-popover-foreground: var(--plca-slate-900);

  --plca-primary: var(--plca-brand-500);
  --plca-primary-foreground: #ffffff;
  --plca-secondary: var(--plca-slate-100);
  --plca-secondary-foreground: var(--plca-slate-800);
  --plca-muted: var(--plca-slate-100);
  --plca-muted-foreground: var(--plca-slate-500);
  --plca-accent: var(--plca-brand-100);
  --plca-accent-foreground: var(--plca-brand-900);
  --plca-destructive: #ef4444;
  --plca-destructive-foreground: #ffffff;
  --plca-success: #10b981;
  --plca-success-foreground: #ffffff;
  --plca-warning: #f59e0b;
  --plca-warning-foreground: #ffffff;
  --plca-border: var(--plca-slate-200);
  --plca-input: var(--plca-slate-300);
  --plca-ring: var(--plca-brand-500);

  --plca-icon: var(--plca-slate-800);
  --plca-icon-muted: var(--plca-slate-500);

  /* Chart */
  --plca-chart-1: var(--plca-brand-500);
  --plca-chart-2: #10b981;
  --plca-chart-3: #f59e0b;
  --plca-chart-4: #8b5cf6;
  --plca-chart-5: #ec4899;

  /* Sidebar */
  --plca-sidebar: rgba(255, 255, 255, 0.72);
  --plca-sidebar-foreground: var(--plca-slate-800);
  --plca-sidebar-primary: var(--plca-brand-500);
  --plca-sidebar-primary-foreground: #ffffff;
  --plca-sidebar-accent: var(--plca-slate-100);
  --plca-sidebar-accent-foreground: var(--plca-slate-800);
  --plca-sidebar-border: var(--plca-slate-200);
  --plca-sidebar-ring: var(--plca-brand-500);

  /* Typography */
  --plca-font-sans: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  --plca-font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --plca-tracking-tight: -0.02em;
  --plca-tracking-normal: 0em;

  /* Radius */
  --plca-radius-sm: 0.5rem;
  --plca-radius-md: 0.75rem;
  --plca-radius-lg: 1rem;
  --plca-radius-xl: 1.25rem;

  /* Shadows */
  --plca-shadow-2xs: 0 1px 2px -1px rgba(2, 8, 20, 0.04);
  --plca-shadow-xs: 0 1px 2px 0 rgba(2, 8, 20, 0.04);
  --plca-shadow-sm: 0 1px 2px 0 rgba(2, 8, 20, 0.05), 0 1px 3px -1px rgba(2, 8, 20, 0.05);
  --plca-shadow-md: 0 4px 8px -2px rgba(2, 8, 20, 0.06), 0 2px 4px -2px rgba(2, 8, 20, 0.04);
  --plca-shadow-lg: 0 8px 24px -8px rgba(2, 8, 20, 0.10), 0 4px 8px -4px rgba(2, 8, 20, 0.04);
  --plca-shadow-xl: 0 16px 40px -10px rgba(2, 8, 20, 0.12), 0 8px 16px -8px rgba(2, 8, 20, 0.06);

  /* Spacing base */
  --plca-spacing: 0.25rem;
}

.dark {
  --plca-background: #030711;
  --plca-foreground: #f8fafc;
  --plca-card: rgba(15, 23, 42, 0.72);
  --plca-card-foreground: #f8fafc;
  --plca-popover: #0f172a;
  --plca-popover-foreground: #f8fafc;

  --plca-primary: #38bdf8;
  --plca-primary-foreground: #0f172a;
  --plca-secondary: #1e293b;
  --plca-secondary-foreground: #f8fafc;
  --plca-muted: #1e293b;
  --plca-muted-foreground: #94a3b8;
  --plca-accent: #0c4a6e;
  --plca-accent-foreground: #e0f2fe;
  --plca-border: rgba(148, 163, 184, 0.2);
  --plca-input: rgba(148, 163, 184, 0.25);
  --plca-ring: #38bdf8;

  --plca-sidebar: rgba(15, 23, 42, 0.72);
  --plca-sidebar-foreground: #f8fafc;
  --plca-sidebar-primary: #38bdf8;
  --plca-sidebar-primary-foreground: #0f172a;
  --plca-sidebar-accent: #1e293b;
  --plca-sidebar-accent-foreground: #f8fafc;
  --plca-sidebar-border: rgba(148, 163, 184, 0.16);

  --plca-shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --plca-shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --plca-shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --plca-shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.32);
  --plca-shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.36);
  --plca-shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.40);
}

    </style>
    <style id="component-vars">
/* PLC·AIOT Component Layer — plain CSS, no @apply referencing local classes */

/* Glass surfaces */
.plca-glass {
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.55);
}

.dark .plca-glass {
  background: rgba(15, 23, 42, 0.60);
  border-color: rgba(148, 163, 184, 0.12);
}

.plca-glass-strong {
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255, 255, 255, 0.65);
}

.dark .plca-glass-strong {
  background: rgba(15, 23, 42, 0.78);
  border-color: rgba(148, 163, 184, 0.14);
}

/* Cards */
.plca-card {
  background: var(--plca-card);
  color: var(--plca-card-foreground);
  border: 1px solid var(--plca-border);
  border-radius: var(--plca-radius-lg);
  box-shadow: var(--plca-shadow-sm);
  transition: box-shadow 150ms cubic-bezier(0.32, 0.72, 0, 1), transform 150ms cubic-bezier(0.32, 0.72, 0, 1);
}

.plca-card-hover:hover {
  box-shadow: var(--plca-shadow-md);
  transform: translateY(-1px);
}

/* Buttons */
.plca-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.375rem;
  font-weight: 600;
  font-size: 0.875rem;
  line-height: 1.25rem;
  padding: 0.5rem 1rem;
  border-radius: var(--plca-radius-md);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background-color 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
  white-space: nowrap;
}

.plca-btn-primary {
  background: var(--plca-primary);
  color: var(--plca-primary-foreground);
  box-shadow: 0 4px 14px -4px rgba(14, 165, 233, 0.35);
}

.plca-btn-primary:hover {
  background: var(--plca-brand-600);
  box-shadow: 0 6px 18px -4px rgba(14, 165, 233, 0.42);
}

.plca-btn-secondary {
  background: var(--plca-secondary);
  color: var(--plca-secondary-foreground);
  border-color: var(--plca-border);
}

.plca-btn-secondary:hover {
  background: var(--plca-muted);
}

.plca-btn-ghost {
  background: transparent;
  color: var(--plca-foreground);
  border-color: var(--plca-border);
}

.plca-btn-ghost:hover {
  background: var(--plca-muted);
}

.plca-btn-pill {
  border-radius: 9999px;
}

/* Forms */
.plca-input {
  width: 100%;
  background: var(--plca-background);
  color: var(--plca-foreground);
  border: 1px solid var(--plca-input);
  border-radius: var(--plca-radius-md);
  padding: 0.625rem 0.875rem;
  font-size: 0.875rem;
  line-height: 1.25rem;
  outline: none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}

.plca-input::placeholder {
  color: var(--plca-muted-foreground);
}

.plca-input:focus {
  border-color: var(--plca-ring);
  box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.18);
}

.plca-label {
  display: block;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--plca-foreground);
  margin-bottom: 0.375rem;
}

.plca-error {
  font-size: 0.75rem;
  color: var(--plca-destructive);
  margin-top: 0.25rem;
}

/* Badges */
.plca-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 1.5rem;
  padding: 0 0.625rem;
  font-size: 0.75rem;
  font-weight: 600;
  border-radius: 9999px;
  white-space: nowrap;
}

.plca-badge-emerald {
  background: rgba(16, 185, 129, 0.12);
  color: #059669;
}

.dark .plca-badge-emerald {
  background: rgba(16, 185, 129, 0.16);
  color: #34d399;
}

.plca-badge-rose {
  background: rgba(239, 68, 68, 0.10);
  color: #dc2626;
}

.dark .plca-badge-rose {
  background: rgba(239, 68, 68, 0.16);
  color: #f87171;
}

.plca-badge-amber {
  background: rgba(245, 158, 11, 0.12);
  color: #d97706;
}

.dark .plca-badge-amber {
  background: rgba(245, 158, 11, 0.16);
  color: #fbbf24;
}

.plca-badge-sky {
  background: rgba(14, 165, 233, 0.12);
  color: #0284c7;
}

.dark .plca-badge-sky {
  background: rgba(56, 189, 248, 0.16);
  color: #38bdf8;
}

/* Navigation */
.plca-topnav {
  position: sticky;
  top: 0;
  z-index: 30;
  height: 4rem;
}

.plca-nav-link {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--plca-muted-foreground);
  padding: 0.375rem 0.625rem;
  border-radius: var(--plca-radius-md);
  transition: color 150ms ease, background-color 150ms ease;
  text-decoration: none;
}

.plca-nav-link:hover {
  color: var(--plca-foreground);
  background: var(--plca-muted);
}

/* Sidebar */
.plca-sidebar-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.625rem 0.875rem;
  border-radius: var(--plca-radius-md);
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--plca-sidebar-foreground);
  text-decoration: none;
  transition: background-color 150ms ease;
}

.plca-sidebar-item:hover {
  background: var(--plca-sidebar-accent);
}

.plca-sidebar-item-active {
  background: rgba(14, 165, 233, 0.10);
  color: var(--plca-primary);
  border-left: 3px solid var(--plca-primary);
}

/* KPI */
.plca-kpi {
  padding: 1rem;
  border-radius: var(--plca-radius-lg);
  min-width: 140px;
}

.plca-kpi-value {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: var(--plca-tracking-tight);
  white-space: nowrap;
}

.plca-kpi-label {
  font-size: 0.8125rem;
  color: var(--plca-muted-foreground);
}

/* Tables */
.plca-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
}

.plca-table th,
.plca-table td {
  padding: 0.75rem 1rem;
  text-align: left;
  border-bottom: 1px solid var(--plca-border);
  white-space: nowrap;
}

.plca-table th {
  font-weight: 600;
  color: var(--plca-muted-foreground);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.plca-table tbody tr:hover {
  background: rgba(14, 165, 233, 0.04);
}

/* Tabs */
.plca-tabs {
  display: flex;
  gap: 0.25rem;
  padding: 0.25rem;
  background: var(--plca-muted);
  border-radius: var(--plca-radius-lg);
  width: fit-content;
}

.plca-tab {
  padding: 0.5rem 1rem;
  border-radius: var(--plca-radius-md);
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--plca-muted-foreground);
  background: transparent;
  border: none;
  cursor: pointer;
  transition: background-color 150ms ease, color 150ms ease;
  white-space: nowrap;
}

.plca-tab:hover {
  color: var(--plca-foreground);
}

.plca-tab-active {
  background: var(--plca-card);
  color: var(--plca-foreground);
  box-shadow: var(--plca-shadow-xs);
}

/* Timeline */
.plca-timeline-item {
  position: relative;
  padding-left: 1.25rem;
  padding-bottom: 1.25rem;
  border-left: 1px solid var(--plca-border);
}

.plca-timeline-item::before {
  content: '';
  position: absolute;
  left: -0.25rem;
  top: 0.25rem;
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 50%;
  background: var(--plca-primary);
}

.plca-timeline-item:last-child {
  border-left-color: transparent;
}

/* Avatar */
.plca-avatar {
  width: 2.25rem;
  height: 2.25rem;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 0.875rem;
  font-weight: 600;
  background: linear-gradient(135deg, var(--plca-brand-400), var(--plca-brand-600));
  color: #fff;
}

/* Scrollbar */
.plca-scroll::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

.plca-scroll::-webkit-scrollbar-thumb {
  background: rgba(14, 165, 233, 0.35);
  border-radius: 3px;
}

/* Map placeholder */
.plca-map {
  background:
    radial-gradient(circle at 25% 35%, rgba(14, 165, 233, 0.14) 0%, transparent 28%),
    radial-gradient(circle at 70% 65%, rgba(16, 185, 129, 0.12) 0%, transparent 26%),
    var(--plca-muted);
  border-radius: var(--plca-radius-lg);
}

/* Toast / notification panel */
.plca-notification-panel {
  position: fixed;
  top: 4.5rem;
  right: 1rem;
  width: 22rem;
  z-index: 40;
  border-radius: var(--plca-radius-lg);
  box-shadow: var(--plca-shadow-xl);
}

/* Section shells */
.plca-section {
  padding-top: 4rem;
  padding-bottom: 4rem;
}

.plca-page-shell {
  display: flex;
  min-height: 100vh;
}

.plca-content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* Pricing card highlight */
.plca-pricing-featured {
  border: 2px solid var(--plca-primary);
  box-shadow: var(--plca-shadow-lg);
}
    </style>

      function updateIcons() {
        const isDark = html.classList.contains('dark');
        if (sunIcon) sunIcon.classList.toggle('hidden', isDark);
        if (moonIcon) moonIcon.classList.toggle('hidden', !isDark);

      if (toggle) {
        toggle.addEventListener('click', function () {

        { id: 5, name: '杭州萧山机器人产业园', region: '华东', address: '浙江省杭州市萧山区红垦农场 88 号', x: 68, y: 48, online: 55, offline: 0, warning: 0, heartbeat: '2026-08-15 14:32:22', status: 'online' },
        { id: 6, name: '武汉光谷电子装配厂', region: '华中', address: '湖北省武汉市东湖高新区光谷大道 77 号', x: 48, y: 50, online: 19, offline: 3, warning: 2, heartbeat: '2026-08-15 14:20:15', status: 'warning' },
        { id: 7, name: '青岛西海岸新区压铸厂', region: '华北', address: '山东省青岛市西海岸新区黄河西路 15 号', x: 74, y: 22, online: 27, offline: 0, warning: 0, heartbeat: '2026-08-15 14:31:58', status: 'online' },
        { id: 8, name: '深圳宝安 SMT 车间', region: '华南', address: '广东省深圳市宝安区福海街道塘尾社区', x: 56, y: 72, online: 64, offline: 1, warning: 1, heartbeat: '2026-08-15 14:32:10', status: 'warning' }
      ];

      let activeId = null;
      let filteredSites = sites.slice();

      const markersContainer = document.getElementById('map-markers');
      const siteList = document.getElementById('site-list');
      const siteCount = document.getElementById('site-count');
      const detailCard = document.getElementById('detail-card');
      const detailClose = document.getElementById('detail-close');
      const mobileSiteToggle = document.getElementById('mobile-site-toggle');
      const mobileSiteClose = document.getElementById('mobile-site-close');
      const sitePanel = document.getElementById('site-panel');

      const regionFilter = document.getElementById('region-filter');
      const statusFilter = document.getElementById('status-filter');
      const siteSearch = document.getElementById('site-search');

      function deviceCount(site) {
        return site.online + site.offline + site.warning;
      }

      function statusText(status) {
        if (status === 'online') return '在线';
        if (status === 'offline') return '离线';
        if (status === 'warning') return '告警';
        return '未知';
      }

      function statusBadgeClass(status) {
        if (status === 'online') return 'plca-badge-emerald';
        if (status === 'offline') return 'plca-badge-rose';
        if (status === 'warning') return 'plca-badge-amber';
        return 'plca-badge-sky';
      }

      function filterSites() {
        const region = regionFilter.value;
        const status = statusFilter.value;
        const query = (siteSearch ? siteSearch.value : '').toLowerCase();
        filteredSites = sites.filter(function (site) {
          if (region !== 'all' && site.region !== region) return false;
          if (status !== 'all' && site.status !== status) return false;
          if (query && !site.name.toLowerCase().includes(query) && !site.address.toLowerCase().includes(query)) return false;
          return true;
        });
        renderMarkers();
        renderList();
        updateKpis();
      }

      function updateKpis() {
        const total = filteredSites.length;
        const online = filteredSites.filter(function (s) { return s.status === 'online'; }).length;
        const warning = filteredSites.filter(function (s) { return s.status === 'warning'; }).length;
        const devices = filteredSites.reduce(function (sum, s) { return sum + deviceCount(s); }, 0);
        document.getElementById('kpi-total').textContent = total;
        document.getElementById('kpi-online').textContent = online;
        document.getElementById('kpi-warning').textContent = warning;
        document.getElementById('kpi-devices').textContent = devices;
      }

      function renderMarkers() {
        markersContainer.innerHTML = '';
        filteredSites.forEach(function (site) {
          const marker = document.createElement('div');
          marker.className = 'plca-map-marker' + (site.id === activeId ? ' plca-map-marker-active' : '');
          marker.style.left = site.x + '%';
          marker.style.top = site.y + '%';
          marker.setAttribute('role', 'button');
          marker.setAttribute('aria-label', site.name);
          marker.innerHTML = '<div class="plca-map-pin ' + site.status + '"><i data-lucide="map-pin" class="h-4 w-4"></i></div>';
          marker.addEventListener('click', function () {
            selectSite(site.id);
          });
          markersContainer.appendChild(marker);
        });
        if (window.lucide) lucide.createIcons();
      }

      function renderList() {
        siteList.innerHTML = '';
        siteCount.textContent = filteredSites.length;
        filteredSites.forEach(function (site) {
          const item = document.createElement('button');
          item.className = 'w-full text-left plca-card p-3 transition-all hover:shadow-md ' + (site.id === activeId ? 'ring-2 ring-primary' : '');
          item.innerHTML =
            '<div class="flex items-start justify-between mb-2">' +
              '<div class="font-medium text-sm text-foreground truncate pr-2">' + site.name + '</div>' +
              '<span class="plca-badge ' + statusBadgeClass(site.status) + '">' + statusText(site.status) + '</span>' +
            '</div>' +
            '<div class="text-xs text-muted-foreground mb-2 line-clamp-2">' + site.address + '</div>' +
            '<div class="flex items-center gap-3 text-xs">' +
              '<span class="flex items-center gap-1 text-[var(--plca-success)]"><i data-lucide="wifi" class="h-3 w-3"></i>' + site.online + '</span>' +
              '<span class="flex items-center gap-1 text-muted-foreground"><i data-lucide="wifi-off" class="h-3 w-3"></i>' + site.offline + '</span>' +
              '<span class="flex items-center gap-1 text-[var(--plca-warning)]"><i data-lucide="alert-triangle" class="h-3 w-3"></i>' + site.warning + '</span>' +
            '</div>';
          item.addEventListener('click', function () {
            selectSite(site.id);
          });
          siteList.appendChild(item);
        });
        if (window.lucide) lucide.createIcons();
      }

      function selectSite(id) {
        activeId = id;
        const site = sites.find(function (s) { return s.id === id; });
        if (!site) return;

        document.getElementById('detail-name').textContent = site.name;
        document.getElementById('detail-address').textContent = site.address;
        document.getElementById('detail-online').textContent = site.online;
        document.getElementById('detail-offline').textContent = site.offline;
        document.getElementById('detail-warning').textContent = site.warning;
        document.getElementById('detail-heartbeat').textContent = site.heartbeat;

        const statusEl = document.getElementById('detail-status');
        statusEl.textContent = statusText(site.status);
        statusEl.className = 'plca-badge ' + statusBadgeClass(site.status);

        detailCard.classList.add('active');
        renderMarkers();
        renderList();
      }

      if (detailClose) {
        detailClose.addEventListener('click', function () {
          detailCard.classList.remove('active');
          activeId = null;
          renderMarkers();
          renderList();
        });
      }

      if (mobileSiteToggle && sitePanel) {
        mobileSiteToggle.addEventListener('click', function () {
          sitePanel.classList.toggle('open');
        });
      }

      if (mobileSiteClose && sitePanel) {
        mobileSiteClose.addEventListener('click', function () {
          sitePanel.classList.remove('open');
        });
      }

      if (regionFilter) regionFilter.addEventListener('change', filterSites);
      if (statusFilter) statusFilter.addEventListener('change', filterSites);
      if (siteSearch) siteSearch.addEventListener('input', filterSites);

      renderMarkers();
      renderList();
      updateKpis();
    })();

    lucide.createIcons();
  </script>
</body>
</html>
