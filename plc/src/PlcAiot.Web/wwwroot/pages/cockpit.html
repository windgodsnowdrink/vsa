    <style id="theme-vars">
/*
 * PLC·AIOT Design Tokens
 * Reference: Apple Design Library (restrained, precise, editorial)
 * Domain: Industrial IoT / PLC Edge Device SaaS
 * Primary: Tech sky blue (#0ea5e9) with glassmorphism surfaces
 * Theme modes: light / dark
 */

:root {
  /* Primitive — brand sky */
  --plca-brand-50: #f0f9ff;
  --plca-brand-100: #e0f2fe;
  --plca-brand-200: #bae6fd;
  --plca-brand-300: #7dd3fc;
  --plca-brand-400: #38bdf8;
  --plca-brand-500: #0ea5e9;
  --plca-brand-600: #0284c7;
  --plca-brand-700: #0369a1;
  --plca-brand-800: #075985;
  --plca-brand-900: #0c4a6e;

  /* Primitive — slate neutrals */
  --plca-slate-50: #f8fafc;
  --plca-slate-100: #f1f5f9;
  --plca-slate-200: #e2e8f0;
  --plca-slate-300: #cbd5e1;
  --plca-slate-400: #94a3b8;
  --plca-slate-500: #64748b;
  --plca-slate-600: #475569;
  --plca-slate-700: #334155;
  --plca-slate-800: #1e293b;
  --plca-slate-900: #0f172a;

  /* Primitive — semantic scales */
  --plca-background: var(--plca-slate-50);
  --plca-foreground: var(--plca-slate-900);
  --plca-card: rgba(255, 255, 255, 0.78);
  --plca-card-foreground: var(--plca-slate-900);
  --plca-popover: #ffffff;
  --plca-popover-foreground: var(--plca-slate-900);

  --plca-primary: var(--plca-brand-500);
  --plca-primary-foreground: #ffffff;
  --plca-secondary: var(--plca-slate-100);
  --plca-secondary-foreground: var(--plca-slate-800);
  --plca-muted: var(--plca-slate-100);
  --plca-muted-foreground: var(--plca-slate-500);
  --plca-accent: var(--plca-brand-100);
  --plca-accent-foreground: var(--plca-brand-900);
  --plca-destructive: #ef4444;
  --plca-destructive-foreground: #ffffff;
  --plca-success: #10b981;
  --plca-success-foreground: #ffffff;
  --plca-warning: #f59e0b;
  --plca-warning-foreground: #ffffff;
  --plca-border: var(--plca-slate-200);
  --plca-input: var(--plca-slate-300);
  --plca-ring: var(--plca-brand-500);

  --plca-icon: var(--plca-slate-800);
  --plca-icon-muted: var(--plca-slate-500);

  /* Chart */
  --plca-chart-1: var(--plca-brand-500);
  --plca-chart-2: #10b981;
  --plca-chart-3: #f59e0b;
  --plca-chart-4: #8b5cf6;
  --plca-chart-5: #ec4899;

  /* Sidebar */
  --plca-sidebar: rgba(255, 255, 255, 0.72);
  --plca-sidebar-foreground: var(--plca-slate-800);
  --plca-sidebar-primary: var(--plca-brand-500);
  --plca-sidebar-primary-foreground: #ffffff;
  --plca-sidebar-accent: var(--plca-slate-100);
  --plca-sidebar-accent-foreground: var(--plca-slate-800);
  --plca-sidebar-border: var(--plca-slate-200);
  --plca-sidebar-ring: var(--plca-brand-500);

  /* Typography */
  --plca-font-sans: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  --plca-font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --plca-tracking-tight: -0.02em;
  --plca-tracking-normal: 0em;

  /* Radius */
  --plca-radius-sm: 0.5rem;
  --plca-radius-md: 0.75rem;
  --plca-radius-lg: 1rem;
  --plca-radius-xl: 1.25rem;

  /* Shadows */
  --plca-shadow-2xs: 0 1px 2px -1px rgba(2, 8, 20, 0.04);
  --plca-shadow-xs: 0 1px 2px 0 rgba(2, 8, 20, 0.04);
  --plca-shadow-sm: 0 1px 2px 0 rgba(2, 8, 20, 0.05), 0 1px 3px -1px rgba(2, 8, 20, 0.05);
  --plca-shadow-md: 0 4px 8px -2px rgba(2, 8, 20, 0.06), 0 2px 4px -2px rgba(2, 8, 20, 0.04);
  --plca-shadow-lg: 0 8px 24px -8px rgba(2, 8, 20, 0.10), 0 4px 8px -4px rgba(2, 8, 20, 0.04);
  --plca-shadow-xl: 0 16px 40px -10px rgba(2, 8, 20, 0.12), 0 8px 16px -8px rgba(2, 8, 20, 0.06);

  /* Spacing base */
  --plca-spacing: 0.25rem;
}

.dark {
  --plca-background: #030711;
  --plca-foreground: #f8fafc;
  --plca-card: rgba(15, 23, 42, 0.72);
  --plca-card-foreground: #f8fafc;
  --plca-popover: #0f172a;
  --plca-popover-foreground: #f8fafc;

  --plca-primary: #38bdf8;
  --plca-primary-foreground: #0f172a;
  --plca-secondary: #1e293b;
  --plca-secondary-foreground: #f8fafc;
  --plca-muted: #1e293b;
  --plca-muted-foreground: #94a3b8;
  --plca-accent: #0c4a6e;
  --plca-accent-foreground: #e0f2fe;
  --plca-border: rgba(148, 163, 184, 0.2);
  --plca-input: rgba(148, 163, 184, 0.25);
  --plca-ring: #38bdf8;

  --plca-sidebar: rgba(15, 23, 42, 0.72);
  --plca-sidebar-foreground: #f8fafc;
  --plca-sidebar-primary: #38bdf8;
  --plca-sidebar-primary-foreground: #0f172a;
  --plca-sidebar-accent: #1e293b;
  --plca-sidebar-accent-foreground: #f8fafc;
  --plca-sidebar-border: rgba(148, 163, 184, 0.16);

  --plca-shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --plca-shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --plca-shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --plca-shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.32);
  --plca-shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.36);
  --plca-shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.40);
}

    </style>
    <style id="component-vars">
/* PLC·AIOT Component Layer — plain CSS, no @apply referencing local classes */

/* Glass surfaces */
.plca-glass {
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.55);
}

.dark .plca-glass {
  background: rgba(15, 23, 42, 0.60);
  border-color: rgba(148, 163, 184, 0.12);
}

.plca-glass-strong {
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255, 255, 255, 0.65);
}

.dark .plca-glass-strong {
  background: rgba(15, 23, 42, 0.78);
  border-color: rgba(148, 163, 184, 0.14);
}

/* Cards */
.plca-card {
  background: var(--plca-card);
  color: var(--plca-card-foreground);
  border: 1px solid var(--plca-border);
  border-radius: var(--plca-radius-lg);
  box-shadow: var(--plca-shadow-sm);
  transition: box-shadow 150ms cubic-bezier(0.32, 0.72, 0, 1), transform 150ms cubic-bezier(0.32, 0.72, 0, 1);
}

.plca-card-hover:hover {
  box-shadow: var(--plca-shadow-md);
  transform: translateY(-1px);
}

/* Buttons */
.plca-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.375rem;
  font-weight: 600;
  font-size: 0.875rem;
  line-height: 1.25rem;
  padding: 0.5rem 1rem;
  border-radius: var(--plca-radius-md);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background-color 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
  white-space: nowrap;
}

.plca-btn-primary {
  background: var(--plca-primary);
  color: var(--plca-primary-foreground);
  box-shadow: 0 4px 14px -4px rgba(14, 165, 233, 0.35);
}

.plca-btn-primary:hover {
  background: var(--plca-brand-600);
  box-shadow: 0 6px 18px -4px rgba(14, 165, 233, 0.42);
}

.plca-btn-secondary {
  background: var(--plca-secondary);
  color: var(--plca-secondary-foreground);
  border-color: var(--plca-border);
}

.plca-btn-secondary:hover {
  background: var(--plca-muted);
}

.plca-btn-ghost {
  background: transparent;
  color: var(--plca-foreground);
  border-color: var(--plca-border);
}

.plca-btn-ghost:hover {
  background: var(--plca-muted);
}

.plca-btn-pill {
  border-radius: 9999px;
}

/* Forms */
.plca-input {
  width: 100%;
  background: var(--plca-background);
  color: var(--plca-foreground);
  border: 1px solid var(--plca-input);
  border-radius: var(--plca-radius-md);
  padding: 0.625rem 0.875rem;
  font-size: 0.875rem;
  line-height: 1.25rem;
  outline: none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}

.plca-input::placeholder {
  color: var(--plca-muted-foreground);
}

.plca-input:focus {
  border-color: var(--plca-ring);
  box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.18);
}

.plca-label {
  display: block;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--plca-foreground);
  margin-bottom: 0.375rem;
}

.plca-error {
  font-size: 0.75rem;
  color: var(--plca-destructive);
  margin-top: 0.25rem;
}

/* Badges */
.plca-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 1.5rem;
  padding: 0 0.625rem;
  font-size: 0.75rem;
  font-weight: 600;
  border-radius: 9999px;
  white-space: nowrap;
}

.plca-badge-emerald {
  background: rgba(16, 185, 129, 0.12);
  color: #059669;
}

.dark .plca-badge-emerald {
  background: rgba(16, 185, 129, 0.16);
  color: #34d399;
}

.plca-badge-rose {
  background: rgba(239, 68, 68, 0.10);
  color: #dc2626;
}

.dark .plca-badge-rose {
  background: rgba(239, 68, 68, 0.16);
  color: #f87171;
}

.plca-badge-amber {
  background: rgba(245, 158, 11, 0.12);
  color: #d97706;
}

.dark .plca-badge-amber {
  background: rgba(245, 158, 11, 0.16);
  color: #fbbf24;
}

.plca-badge-sky {
  background: rgba(14, 165, 233, 0.12);
  color: #0284c7;
}

.dark .plca-badge-sky {
  background: rgba(56, 189, 248, 0.16);
  color: #38bdf8;
}

/* Navigation */
.plca-topnav {
  position: sticky;
  top: 0;
  z-index: 30;
  height: 4rem;
}

.plca-nav-link {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--plca-muted-foreground);
  padding: 0.375rem 0.625rem;
  border-radius: var(--plca-radius-md);
  transition: color 150ms ease, background-color 150ms ease;
  text-decoration: none;
}

.plca-nav-link:hover {
  color: var(--plca-foreground);
  background: var(--plca-muted);
}

/* Sidebar */
.plca-sidebar-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.625rem 0.875rem;
  border-radius: var(--plca-radius-md);
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--plca-sidebar-foreground);
  text-decoration: none;
  transition: background-color 150ms ease;
}

.plca-sidebar-item:hover {
  background: var(--plca-sidebar-accent);
}

.plca-sidebar-item-active {
  background: rgba(14, 165, 233, 0.10);
  color: var(--plca-primary);
  border-left: 3px solid var(--plca-primary);
}

/* KPI */
.plca-kpi {
  padding: 1rem;
  border-radius: var(--plca-radius-lg);
  min-width: 140px;
}

.plca-kpi-value {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: var(--plca-tracking-tight);
  white-space: nowrap;
}

.plca-kpi-label {
  font-size: 0.8125rem;
  color: var(--plca-muted-foreground);
}

/* Tables */
.plca-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
}

.plca-table th,
.plca-table td {
  padding: 0.75rem 1rem;
  text-align: left;
  border-bottom: 1px solid var(--plca-border);
  white-space: nowrap;
}

.plca-table th {
  font-weight: 600;
  color: var(--plca-muted-foreground);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.plca-table tbody tr:hover {
  background: rgba(14, 165, 233, 0.04);
}

/* Tabs */
.plca-tabs {
  display: flex;
  gap: 0.25rem;
  padding: 0.25rem;
  background: var(--plca-muted);
  border-radius: var(--plca-radius-lg);
  width: fit-content;
}

.plca-tab {
  padding: 0.5rem 1rem;
  border-radius: var(--plca-radius-md);
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--plca-muted-foreground);
  background: transparent;
  border: none;
  cursor: pointer;
  transition: background-color 150ms ease, color 150ms ease;
  white-space: nowrap;
}

.plca-tab:hover {
  color: var(--plca-foreground);
}

.plca-tab-active {
  background: var(--plca-card);
  color: var(--plca-foreground);
  box-shadow: var(--plca-shadow-xs);
}

/* Timeline */
.plca-timeline-item {
  position: relative;
  padding-left: 1.25rem;
  padding-bottom: 1.25rem;
  border-left: 1px solid var(--plca-border);
}

.plca-timeline-item::before {
  content: '';
  position: absolute;
  left: -0.25rem;
  top: 0.25rem;
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 50%;
  background: var(--plca-primary);
}

.plca-timeline-item:last-child {
  border-left-color: transparent;
}

/* Avatar */
.plca-avatar {
  width: 2.25rem;
  height: 2.25rem;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 0.875rem;
  font-weight: 600;
  background: linear-gradient(135deg, var(--plca-brand-400), var(--plca-brand-600));
  color: #fff;
}

/* Scrollbar */
.plca-scroll::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

.plca-scroll::-webkit-scrollbar-thumb {
  background: rgba(14, 165, 233, 0.35);
  border-radius: 3px;
}

/* Map placeholder */
.plca-map {
  background:
    radial-gradient(circle at 25% 35%, rgba(14, 165, 233, 0.14) 0%, transparent 28%),
    radial-gradient(circle at 70% 65%, rgba(16, 185, 129, 0.12) 0%, transparent 26%),
    var(--plca-muted);
  border-radius: var(--plca-radius-lg);
}

/* Toast / notification panel */
.plca-notification-panel {
  position: fixed;
  top: 4.5rem;
  right: 1rem;
  width: 22rem;
  z-index: 40;
  border-radius: var(--plca-radius-lg);
  box-shadow: var(--plca-shadow-xl);
}

/* Section shells */
.plca-section {
  padding-top: 4rem;
  padding-bottom: 4rem;
}

.plca-page-shell {
  display: flex;
  min-height: 100vh;
}

.plca-content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* Pricing card highlight */
.plca-pricing-featured {
  border: 2px solid var(--plca-primary);
  box-shadow: var(--plca-shadow-lg);
}
    </style>

  <script>
    (function () {
      'use strict';

      // 初始化图标
      lucide.createIcons();

      // 主题切换
      const html = document.documentElement;
      const themeToggle = document.getElementById('themeToggle');
      function applyTheme(isDark) {
        if (isDark) {
          html.classList.add('dark');
          html.classList.remove('light');
        } else {
          html.classList.add('light');
          html.classList.remove('dark');
        }
        updateCharts();
      }
      themeToggle.addEventListener('click', () => {
        applyTheme(!html.classList.contains('dark'));
      });

      // 时钟
      const clock = document.getElementById('clock');
      function updateClock() {
        const now = new Date();
        clock.textContent = now.toLocaleString('zh-CN', {
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        });
      }
      updateClock();
      setInterval(updateClock, 1000);

      // 移动端侧边栏
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const openSidebar = document.getElementById('openSidebar');
      const closeSidebar = document.getElementById('closeSidebar');
      function setSidebar(open) {
        if (open) {
          sidebar.classList.remove('-translate-x-full');
          overlay.classList.remove('hidden');
        } else {
          sidebar.classList.add('-translate-x-full');
          overlay.classList.add('hidden');
        }
      }
      openSidebar.addEventListener('click', () => setSidebar(true));
      closeSidebar.addEventListener('click', () => setSidebar(false));
      overlay.addEventListener('click', () => setSidebar(false));

      // 通知面板
      const notifToggle = document.getElementById('notifToggle');
      const notificationPanel = document.getElementById('notificationPanel');
      const notifDot = document.getElementById('notifDot');
      const markAllRead = document.getElementById('markAllRead');
      notifToggle.addEventListener('click', () => {
        notificationPanel.classList.toggle('hidden');
      });
      markAllRead.addEventListener('click', () => {
        notifDot.classList.add('hidden');
        notificationPanel.querySelectorAll('.bg-destructive, .bg-amber-500, .bg-primary').forEach(el => {
          el.classList.add('bg-muted-foreground');
        });
      });
      document.addEventListener('click', (e) => {
        if (!notificationPanel.contains(e.target) && e.target !== notifToggle && !notifToggle.contains(e.target)) {
          notificationPanel.classList.add('hidden');
        }
      });

      // 取 CSS 变量颜色
      function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      // 图表与真实数据接入（/api/gateway/devices + /api/gateway/protocols）
      let statusChart, protocolChart, pollChart;

      // 兼容 ASP.NET 默认 camelCase 与服务端大小写差异
      function pick(obj) {
        for (var i = 1; i < arguments.length; i++) {
          var k = arguments[i];
          if (obj != null && obj[k] !== undefined) return obj[k];
        }
        return undefined;
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      async function apiGet(url) {
        var res = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error(url + ' -> ' + res.status);
        return res.json();
      }

      function renderKpis(devices, protocols) {
        var total = devices.length;
        var enabled = devices.filter(function (d) { return !!pick(d, 'enabled', 'Enabled'); }).length;
        document.getElementById('kpi-total').textContent = total;
        document.getElementById('kpi-enabled').textContent = enabled;
        document.getElementById('kpi-disabled').textContent = total - enabled;
        document.getElementById('kpi-protocols').textContent = protocols.length;
      }

      function renderSnapshot(devices) {
        var body = document.getElementById('deviceSnapshotBody');
        if (!devices.length) {
          body.innerHTML = '<tr><td colspan="6" class="text-muted-foreground">暂无设备</td></tr>';
          return;
        }
        body.innerHTML = devices.map(function (d) {
          var en = !!pick(d, 'enabled', 'Enabled');
          var status = en
            ? '<span class="plca-badge plca-badge-emerald">已启用</span>'
            : '<span class="plca-badge plca-badge-rose">未启用</span>';
          var addr = (pick(d, 'host', 'Host') || '-') + ':' + (pick(d, 'port', 'Port') != null ? pick(d, 'port', 'Port') : '-');
          var unit = pick(d, 'unitId', 'UnitId');
          var poll = pick(d, 'pollIntervalMs', 'PollIntervalMs');
          return '<tr>' +
            '<td class="font-medium">' + escapeHtml(pick(d, 'id', 'Id')) + '</td>' +
            '<td><span class="plca-badge plca-badge-sky">' + escapeHtml(pick(d, 'protocol', 'Protocol') || '-') + '</span></td>' +
            '<td class="font-mono text-muted-foreground">' + escapeHtml(addr) + '</td>' +
            '<td class="font-mono text-muted-foreground">' + (unit != null ? unit : '-') + '</td>' +
            '<td>' + (poll != null ? poll : '-') + '</td>' +
            '<td>' + status + '</td>' +
            '</tr>';
        }).join('');
      }

      function buildCharts() {
        var muted = cssVar('--plca-muted-foreground');
        var border = cssVar('--plca-border');
        var c1 = cssVar('--plca-chart-1');
        var c2 = cssVar('--plca-chart-2');
        var c3 = cssVar('--plca-chart-3');
        var c4 = cssVar('--plca-chart-4');

        statusChart = new Chart(document.getElementById('statusChart'), {
          type: 'doughnut',
          data: { labels: ['已启用', '未启用'], datasets: [{ data: [0, 0], backgroundColor: [c2, c3], borderColor: cssVar('--plca-card'), borderWidth: 2 }] },
          options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { position: 'bottom', labels: { color: muted } } } }
        });

        protocolChart = new Chart(document.getElementById('protocolChart'), {
          type: 'bar',
          data: { labels: [], datasets: [{ label: '设备数', data: [], backgroundColor: c1 + 'cc', borderColor: c1, borderWidth: 1, borderRadius: 4 }] },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { color: border, drawBorder: false }, ticks: { color: muted } },
              y: { beginAtZero: true, grid: { color: border, drawBorder: false }, ticks: { color: muted, precision: 0, stepSize: 1 } }
            }
          }
        });

        pollChart = new Chart(document.getElementById('pollChart'), {
          type: 'bar',
          data: { labels: [], datasets: [{ label: '采集间隔(ms)', data: [], backgroundColor: c4 + 'cc', borderColor: c4, borderWidth: 1, borderRadius: 4 }] },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { color: border, drawBorder: false }, ticks: { color: muted } },
              y: { beginAtZero: true, grid: { color: border, drawBorder: false }, ticks: { color: muted } }
            }
          }
        });
      }

      function updateChartsTheme() {
        var muted = cssVar('--plca-muted-foreground');
        var border = cssVar('--plca-border');
        [statusChart, protocolChart, pollChart].forEach(function (chart) {
          if (!chart) return;
          if (chart.options.plugins.legend) chart.options.plugins.legend.labels.color = muted;
          Object.keys(chart.options.scales || {}).forEach(function (k) {
            var scale = chart.options.scales[k];
            if (scale.grid) scale.grid.color = border;
            if (scale.ticks) scale.ticks.color = muted;
          });
          chart.update();
        });
      }

      // applyTheme() 仍会调用 updateCharts()，此处兼容
      function updateCharts() { updateChartsTheme(); }

      async function loadCockpit() {
        try {
          var results = await Promise.all([
            apiGet('/api/gateway/devices'),
            apiGet('/api/gateway/protocols')
          ]);
          var devices = results[0];
          var protocols = results[1];
          renderKpis(devices, protocols);
          renderSnapshot(devices);

          var enabled = devices.filter(function (d) { return !!pick(d, 'enabled', 'Enabled'); }).length;
          statusChart.data.datasets[0].data = [enabled, devices.length - enabled];
          statusChart.update();

          var byProto = {};
          devices.forEach(function (d) {
            var k = pick(d, 'protocol', 'Protocol') || 'unknown';
            byProto[k] = (byProto[k] || 0) + 1;
          });
          protocolChart.data.labels = Object.keys(byProto);
          protocolChart.data.datasets[0].data = Object.keys(byProto).map(function (k) { return byProto[k]; });
          protocolChart.update();

          pollChart.data.labels = devices.map(function (d) { return pick(d, 'id', 'Id'); });
          pollChart.data.datasets[0].data = devices.map(function (d) { return pick(d, 'pollIntervalMs', 'PollIntervalMs') || 0; });
          pollChart.update();
        } catch (err) {
          console.error('[cockpit] 加载真实数据失败:', err);
        }
      }

      buildCharts();
      loadCockpit();
      setInterval(loadCockpit, 30000);

      var refreshBtn = document.getElementById('refreshDevices');
      if (refreshBtn) refreshBtn.addEventListener('click', loadCockpit);
    })();
  </script>
</body>
</html>
