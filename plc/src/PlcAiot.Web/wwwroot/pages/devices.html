    <style id="theme-vars">
/*
 * PLC·AIOT Design Tokens
 * Reference: Apple Design Library (restrained, precise, editorial)
 * Domain: Industrial IoT / PLC Edge Device SaaS
 * Primary: Tech sky blue (#0ea5e9) with glassmorphism surfaces
 * Theme modes: light / dark
 */

:root {
  /* Primitive — brand sky */
  --plca-brand-50: #f0f9ff;
  --plca-brand-100: #e0f2fe;
  --plca-brand-200: #bae6fd;
  --plca-brand-300: #7dd3fc;
  --plca-brand-400: #38bdf8;
  --plca-brand-500: #0ea5e9;
  --plca-brand-600: #0284c7;
  --plca-brand-700: #0369a1;
  --plca-brand-800: #075985;
  --plca-brand-900: #0c4a6e;

  /* Primitive — slate neutrals */
  --plca-slate-50: #f8fafc;
  --plca-slate-100: #f1f5f9;
  --plca-slate-200: #e2e8f0;
  --plca-slate-300: #cbd5e1;
  --plca-slate-400: #94a3b8;
  --plca-slate-500: #64748b;
  --plca-slate-600: #475569;
  --plca-slate-700: #334155;
  --plca-slate-800: #1e293b;
  --plca-slate-900: #0f172a;

  /* Primitive — semantic scales */
  --plca-background: var(--plca-slate-50);
  --plca-foreground: var(--plca-slate-900);
  --plca-card: rgba(255, 255, 255, 0.78);
  --plca-card-foreground: var(--plca-slate-900);
  --plca-popover: #ffffff;
  --plca-popover-foreground: var(--plca-slate-900);

  --plca-primary: var(--plca-brand-500);
  --plca-primary-foreground: #ffffff;
  --plca-secondary: var(--plca-slate-100);
  --plca-secondary-foreground: var(--plca-slate-800);
  --plca-muted: var(--plca-slate-100);
  --plca-muted-foreground: var(--plca-slate-500);
  --plca-accent: var(--plca-brand-100);
  --plca-accent-foreground: var(--plca-brand-900);
  --plca-destructive: #ef4444;
  --plca-destructive-foreground: #ffffff;
  --plca-success: #10b981;
  --plca-success-foreground: #ffffff;
  --plca-warning: #f59e0b;
  --plca-warning-foreground: #ffffff;
  --plca-border: var(--plca-slate-200);
  --plca-input: var(--plca-slate-300);
  --plca-ring: var(--plca-brand-500);

  --plca-icon: var(--plca-slate-800);
  --plca-icon-muted: var(--plca-slate-500);

  /* Chart */
  --plca-chart-1: var(--plca-brand-500);
  --plca-chart-2: #10b981;
  --plca-chart-3: #f59e0b;
  --plca-chart-4: #8b5cf6;
  --plca-chart-5: #ec4899;

  /* Sidebar */
  --plca-sidebar: rgba(255, 255, 255, 0.72);
  --plca-sidebar-foreground: var(--plca-slate-800);
  --plca-sidebar-primary: var(--plca-brand-500);
  --plca-sidebar-primary-foreground: #ffffff;
  --plca-sidebar-accent: var(--plca-slate-100);
  --plca-sidebar-accent-foreground: var(--plca-slate-800);
  --plca-sidebar-border: var(--plca-slate-200);
  --plca-sidebar-ring: var(--plca-brand-500);

  /* Typography */
  --plca-font-sans: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  --plca-font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --plca-tracking-tight: -0.02em;
  --plca-tracking-normal: 0em;

  /* Radius */
  --plca-radius-sm: 0.5rem;
  --plca-radius-md: 0.75rem;
  --plca-radius-lg: 1rem;
  --plca-radius-xl: 1.25rem;

  /* Shadows */
  --plca-shadow-2xs: 0 1px 2px -1px rgba(2, 8, 20, 0.04);
  --plca-shadow-xs: 0 1px 2px 0 rgba(2, 8, 20, 0.04);
  --plca-shadow-sm: 0 1px 2px 0 rgba(2, 8, 20, 0.05), 0 1px 3px -1px rgba(2, 8, 20, 0.05);
  --plca-shadow-md: 0 4px 8px -2px rgba(2, 8, 20, 0.06), 0 2px 4px -2px rgba(2, 8, 20, 0.04);
  --plca-shadow-lg: 0 8px 24px -8px rgba(2, 8, 20, 0.10), 0 4px 8px -4px rgba(2, 8, 20, 0.04);
  --plca-shadow-xl: 0 16px 40px -10px rgba(2, 8, 20, 0.12), 0 8px 16px -8px rgba(2, 8, 20, 0.06);

  /* Spacing base */
  --plca-spacing: 0.25rem;
}

.dark {
  --plca-background: #030711;
  --plca-foreground: #f8fafc;
  --plca-card: rgba(15, 23, 42, 0.72);
  --plca-card-foreground: #f8fafc;
  --plca-popover: #0f172a;
  --plca-popover-foreground: #f8fafc;

  --plca-primary: #38bdf8;
  --plca-primary-foreground: #0f172a;
  --plca-secondary: #1e293b;
  --plca-secondary-foreground: #f8fafc;
  --plca-muted: #1e293b;
  --plca-muted-foreground: #94a3b8;
  --plca-accent: #0c4a6e;
  --plca-accent-foreground: #e0f2fe;
  --plca-border: rgba(148, 163, 184, 0.2);
  --plca-input: rgba(148, 163, 184, 0.25);
  --plca-ring: #38bdf8;

  --plca-sidebar: rgba(15, 23, 42, 0.72);
  --plca-sidebar-foreground: #f8fafc;
  --plca-sidebar-primary: #38bdf8;
  --plca-sidebar-primary-foreground: #0f172a;
  --plca-sidebar-accent: #1e293b;
  --plca-sidebar-accent-foreground: #f8fafc;
  --plca-sidebar-border: rgba(148, 163, 184, 0.16);

  --plca-shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --plca-shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --plca-shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --plca-shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.32);
  --plca-shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.36);
  --plca-shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.40);
}

    </style>
    <style id="component-vars">
/* PLC·AIOT Component Layer — plain CSS, no @apply referencing local classes */

/* Glass surfaces */
.plca-glass {
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.55);
}

.dark .plca-glass {
  background: rgba(15, 23, 42, 0.60);
  border-color: rgba(148, 163, 184, 0.12);
}

.plca-glass-strong {
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255, 255, 255, 0.65);
}

.dark .plca-glass-strong {
  background: rgba(15, 23, 42, 0.78);
  border-color: rgba(148, 163, 184, 0.14);
}

/* Cards */
.plca-card {
  background: var(--plca-card);
  color: var(--plca-card-foreground);
  border: 1px solid var(--plca-border);
  border-radius: var(--plca-radius-lg);
  box-shadow: var(--plca-shadow-sm);
  transition: box-shadow 150ms cubic-bezier(0.32, 0.72, 0, 1), transform 150ms cubic-bezier(0.32, 0.72, 0, 1);
}

.plca-card-hover:hover {
  box-shadow: var(--plca-shadow-md);
  transform: translateY(-1px);
}

/* Buttons */
.plca-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.375rem;
  font-weight: 600;
  font-size: 0.875rem;
  line-height: 1.25rem;
  padding: 0.5rem 1rem;
  border-radius: var(--plca-radius-md);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background-color 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
  white-space: nowrap;
}

.plca-btn-primary {
  background: var(--plca-primary);
  color: var(--plca-primary-foreground);
  box-shadow: 0 4px 14px -4px rgba(14, 165, 233, 0.35);
}

.plca-btn-primary:hover {
  background: var(--plca-brand-600);
  box-shadow: 0 6px 18px -4px rgba(14, 165, 233, 0.42);
}

.plca-btn-secondary {
  background: var(--plca-secondary);
  color: var(--plca-secondary-foreground);
  border-color: var(--plca-border);
}

.plca-btn-secondary:hover {
  background: var(--plca-muted);
}

.plca-btn-ghost {
  background: transparent;
  color: var(--plca-foreground);
  border-color: var(--plca-border);
}

.plca-btn-ghost:hover {
  background: var(--plca-muted);
}

.plca-btn-pill {
  border-radius: 9999px;
}

/* Forms */
.plca-input {
  width: 100%;
  background: var(--plca-background);
  color: var(--plca-foreground);
  border: 1px solid var(--plca-input);
  border-radius: var(--plca-radius-md);
  padding: 0.625rem 0.875rem;
  font-size: 0.875rem;
  line-height: 1.25rem;
  outline: none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}

.plca-input::placeholder {
  color: var(--plca-muted-foreground);
}

.plca-input:focus {
  border-color: var(--plca-ring);
  box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.18);
}

.plca-label {
  display: block;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--plca-foreground);
  margin-bottom: 0.375rem;
}

.plca-error {
  font-size: 0.75rem;
  color: var(--plca-destructive);
  margin-top: 0.25rem;
}

/* Badges */
.plca-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 1.5rem;
  padding: 0 0.625rem;
  font-size: 0.75rem;
  font-weight: 600;
  border-radius: 9999px;
  white-space: nowrap;
}

.plca-badge-emerald {
  background: rgba(16, 185, 129, 0.12);
  color: #059669;
}

.dark .plca-badge-emerald {
  background: rgba(16, 185, 129, 0.16);
  color: #34d399;
}

.plca-badge-rose {
  background: rgba(239, 68, 68, 0.10);
  color: #dc2626;
}

.dark .plca-badge-rose {
  background: rgba(239, 68, 68, 0.16);
  color: #f87171;
}

.plca-badge-amber {
  background: rgba(245, 158, 11, 0.12);
  color: #d97706;
}

.dark .plca-badge-amber {
  background: rgba(245, 158, 11, 0.16);
  color: #fbbf24;
}

.plca-badge-sky {
  background: rgba(14, 165, 233, 0.12);
  color: #0284c7;
}

.dark .plca-badge-sky {
  background: rgba(56, 189, 248, 0.16);
  color: #38bdf8;
}

/* Navigation */
.plca-topnav {
  position: sticky;
  top: 0;
  z-index: 30;
  height: 4rem;
}

.plca-nav-link {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--plca-muted-foreground);
  padding: 0.375rem 0.625rem;
  border-radius: var(--plca-radius-md);
  transition: color 150ms ease, background-color 150ms ease;
  text-decoration: none;
}

.plca-nav-link:hover {
  color: var(--plca-foreground);
  background: var(--plca-muted);
}

/* Sidebar */
.plca-sidebar-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.625rem 0.875rem;
  border-radius: var(--plca-radius-md);
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--plca-sidebar-foreground);
  text-decoration: none;
  transition: background-color 150ms ease;
}

.plca-sidebar-item:hover {
  background: var(--plca-sidebar-accent);
}

.plca-sidebar-item-active {
  background: rgba(14, 165, 233, 0.10);
  color: var(--plca-primary);
  border-left: 3px solid var(--plca-primary);
}

/* KPI */
.plca-kpi {
  padding: 1rem;
  border-radius: var(--plca-radius-lg);
  min-width: 140px;
}

.plca-kpi-value {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: var(--plca-tracking-tight);
  white-space: nowrap;
}

.plca-kpi-label {
  font-size: 0.8125rem;
  color: var(--plca-muted-foreground);
}

/* Tables */
.plca-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
}

.plca-table th,
.plca-table td {
  padding: 0.75rem 1rem;
  text-align: left;
  border-bottom: 1px solid var(--plca-border);
  white-space: nowrap;
}

.plca-table th {
  font-weight: 600;
  color: var(--plca-muted-foreground);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.plca-table tbody tr:hover {
  background: rgba(14, 165, 233, 0.04);
}

/* Tabs */
.plca-tabs {
  display: flex;
  gap: 0.25rem;
  padding: 0.25rem;
  background: var(--plca-muted);
  border-radius: var(--plca-radius-lg);
  width: fit-content;
}

.plca-tab {
  padding: 0.5rem 1rem;
  border-radius: var(--plca-radius-md);
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--plca-muted-foreground);
  background: transparent;
  border: none;
  cursor: pointer;
  transition: background-color 150ms ease, color 150ms ease;
  white-space: nowrap;
}

.plca-tab:hover {
  color: var(--plca-foreground);
}

.plca-tab-active {
  background: var(--plca-card);
  color: var(--plca-foreground);
  box-shadow: var(--plca-shadow-xs);
}

/* Timeline */
.plca-timeline-item {
  position: relative;
  padding-left: 1.25rem;
  padding-bottom: 1.25rem;
  border-left: 1px solid var(--plca-border);
}

.plca-timeline-item::before {
  content: '';
  position: absolute;
  left: -0.25rem;
  top: 0.25rem;
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 50%;
  background: var(--plca-primary);
}

.plca-timeline-item:last-child {
  border-left-color: transparent;
}

/* Avatar */
.plca-avatar {
  width: 2.25rem;
  height: 2.25rem;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 0.875rem;
  font-weight: 600;
  background: linear-gradient(135deg, var(--plca-brand-400), var(--plca-brand-600));
  color: #fff;
}

/* Scrollbar */
.plca-scroll::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

.plca-scroll::-webkit-scrollbar-thumb {
  background: rgba(14, 165, 233, 0.35);
  border-radius: 3px;
}

/* Map placeholder */
.plca-map {
  background:
    radial-gradient(circle at 25% 35%, rgba(14, 165, 233, 0.14) 0%, transparent 28%),
    radial-gradient(circle at 70% 65%, rgba(16, 185, 129, 0.12) 0%, transparent 26%),
    var(--plca-muted);
  border-radius: var(--plca-radius-lg);
}

/* Toast / notification panel */
.plca-notification-panel {
  position: fixed;
  top: 4.5rem;
  right: 1rem;
  width: 22rem;
  z-index: 40;
  border-radius: var(--plca-radius-lg);
  box-shadow: var(--plca-shadow-xl);
}

/* Section shells */
.plca-section {
  padding-top: 4rem;
  padding-bottom: 4rem;
}

.plca-page-shell {
  display: flex;
  min-height: 100vh;
}

.plca-content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* Pricing card highlight */
.plca-pricing-featured {
  border: 2px solid var(--plca-primary);
  box-shadow: var(--plca-shadow-lg);
}
    </style>

  <script>
    (function () {
      const html = document.documentElement;
      const saved = localStorage.getItem('plca-theme');
      if (saved === 'dark') html.classList.add('dark');
      else if (saved === 'light') html.classList.remove('dark');
    })();

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('mobile-sidebar-overlay');
      if (!sidebar) return;
      const isOpen = !sidebar.classList.contains('hidden');
      if (isOpen) {
        sidebar.classList.add('hidden');
        sidebar.classList.remove('flex');
        if (overlay) overlay.classList.add('hidden');
      } else {
        sidebar.classList.remove('hidden');
        sidebar.classList.add('flex');
        if (overlay) overlay.classList.remove('hidden');
      }
    }

    function pick(obj, ...keys) {
      keys = keys || [];
      for (let i = 0; i < keys.length; i++) {
        const k = keys[i];
        if (obj[k] !== undefined && obj[k] !== null) return obj[k];
      }
      return undefined;
    }

    function escapeHtml(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    async function apiGet(url) {
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) throw new Error(url + ' → ' + res.status);
      return res.json();
    }

    let allDevices = [];
    let currentDevice = null;

    async function loadDevices() {
      const body = document.getElementById('device-table-body');
      body.innerHTML = '<tr><td colspan="7" class="px-4 py-10 text-center text-sm text-muted-foreground">正在加载设备…</td></tr>';
      try {
        const [devices, protocols] = await Promise.all([
          apiGet('/api/gateway/devices'),
          apiGet('/api/gateway/protocols').catch(function () { return []; })
        ]);
        allDevices = Array.isArray(devices) ? devices : [];
        const protocolSet = new Set((Array.isArray(protocols) ? protocols : []).map(function (p) { return String(p); }));
        renderKpis(allDevices, protocolSet);
        renderTable();
      } catch (err) {
        body.innerHTML = '<tr><td colspan="7" class="px-4 py-10 text-center text-sm text-rose-500">加载失败：' + escapeHtml(err.message) + '</td></tr>';
      }
    }

    function renderKpis(devices, protocolSet) {
      const total = devices.length;
      const enabled = devices.filter(function (d) { return pick(d, 'Enabled', 'enabled') === true; }).length;
      document.getElementById('dv-total').textContent = total;
      document.getElementById('dv-online').textContent = enabled;
      document.getElementById('dv-offline').textContent = total - enabled;
      const protos = new Set(devices.map(function (d) { return pick(d, 'Protocol', 'protocol'); }).filter(Boolean).map(String));
      document.getElementById('dv-protocols').textContent = protos.size || protocolSet.size;
    }

    function applyFilter() {
      renderTable();
    }

    function renderTable() {
      const status = (document.getElementById('filter-status') || {}).value || '';
      const keyword = ((document.getElementById('filter-keyword') || {}).value || '').trim().toLowerCase();
      const rows = allDevices.filter(function (d) {
        const enabled = pick(d, 'Enabled', 'enabled') === true;
        if (status === 'enabled' && !enabled) return false;
        if (status === 'disabled' && enabled) return false;
        if (keyword) {
          const hay = [pick(d, 'Id', 'id'), pick(d, 'Protocol', 'protocol'), pick(d, 'Host', 'host')]
            .filter(Boolean).join(' ').toLowerCase();
          if (hay.indexOf(keyword) === -1) return false;
        }
        return true;
      });
      const body = document.getElementById('device-table-body');
      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="7" class="px-4 py-10 text-center text-sm text-muted-foreground">无匹配设备</td></tr>';
        return;
      }
      body.innerHTML = rows.map(function (d) {
        const id = pick(d, 'Id', 'id');
        const protocol = pick(d, 'Protocol', 'protocol');
        const host = pick(d, 'Host', 'host');
        const port = pick(d, 'Port', 'port');
        const unitId = pick(d, 'UnitId', 'unitId');
        const poll = pick(d, 'PollIntervalMs', 'pollIntervalMs');
        const enabled = pick(d, 'Enabled', 'enabled') === true;
        const statusBadge = enabled
          ? '<span class="plca-badge plca-badge-emerald">已启用</span>'
          : '<span class="plca-badge plca-badge-rose">未启用</span>';
        const code = escapeHtml(id == null ? '—' : id);
        return '<tr>' +
          '<td class="font-mono">' + code + '</td>' +
          '<td>' + escapeHtml(protocol == null ? '—' : protocol) + '</td>' +
          '<td class="font-mono text-muted-foreground">' + escapeHtml(host == null ? '—' : host) + ':' + escapeHtml(port == null ? '—' : port) + '</td>' +
          '<td class="text-right font-mono">' + escapeHtml(unitId == null ? '—' : unitId) + '</td>' +
          '<td class="text-right font-mono">' + escapeHtml(poll == null ? '—' : poll) + ' ms</td>' +
          '<td>' + statusBadge + '</td>' +
          '<td class="text-right"><div class="flex items-center justify-end gap-2">' +
          '<button class="plca-btn plca-btn-secondary h-8 px-2.5 text-xs" onclick="openPanel(\'' + code + '\')"><i data-lucide="file-text" class="h-3.5 w-3.5"></i>详情</button>' +
          '</div></td>' +
          '</tr>';
      }).join('');
      if (window.lucide) lucide.createIcons();
    }

    function openPanel(code) {
      const panel = document.getElementById('device-panel');
      const codeEl = document.getElementById('panel-device-code');
      currentDevice = allDevices.find(function (d) { return String(pick(d, 'Id', 'id')) === String(code); }) || null;
      const id = currentDevice ? pick(currentDevice, 'Id', 'id') : code;
      if (codeEl) codeEl.textContent = id == null ? '—' : id;
      renderPanelInfo(currentDevice);
      panel.setAttribute('aria-hidden', 'false');
      panel.classList.remove('plca-device-panel-closed');
      panel.classList.add('plca-device-panel-open');
      if (window.lucide) lucide.createIcons();
    }

    function renderPanelInfo(d) {
      const el = document.getElementById('panel-info');
      if (!el) return;
      if (!d) { el.innerHTML = '<p class="text-sm text-muted-foreground">未找到设备配置。</p>'; return; }
      const fields = [
        ['设备ID', pick(d, 'Id', 'id')],
        ['协议', pick(d, 'Protocol', 'protocol')],
        ['地址', pick(d, 'Host', 'host') + ':' + pick(d, 'Port', 'port')],
        ['UnitId', pick(d, 'UnitId', 'unitId')],
        ['机架 / 槽号', pick(d, 'Rack', 'rack') + ' / ' + pick(d, 'Slot', 'slot')],
        ['采集间隔', pick(d, 'PollIntervalMs', 'pollIntervalMs') + ' ms'],
        ['状态', pick(d, 'Enabled', 'enabled') === true ? '已启用' : '未启用']
      ];
      el.innerHTML = fields.map(function (f) {
        return '<div class="plca-card p-3"><p class="text-xs text-muted-foreground">' + escapeHtml(f[0]) +
          '</p><p class="font-medium font-mono">' + escapeHtml(f[1] == null ? '—' : f[1]) + '</p></div>';
      }).join('');
    }

    function closePanel() {
      const panel = document.getElementById('device-panel');
      panel.setAttribute('aria-hidden', 'true');
      panel.classList.remove('plca-device-panel-open');
      panel.classList.add('plca-device-panel-closed');
    }

    async function readDevice() {
      const out = document.getElementById('read-result');
      if (!currentDevice) { out.textContent = '请先选择设备'; return; }
      const deviceId = pick(currentDevice, 'Id', 'id');
      const start = parseInt(document.getElementById('read-start').value, 10) || 0;
      const count = parseInt(document.getElementById('read-count').value, 10) || 1;
      const type = parseInt(document.getElementById('read-type').value, 10) || 0;
      out.textContent = '请求中…';
      try {
        const res = await fetch('/api/gateway/read', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ deviceId: deviceId, start: start, count: count, type: type })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        const bin = atob(json.data);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const hex = Array.prototype.map.call(bytes, function (b) { return b.toString(16).padStart(2, '0'); }).join(' ');
        out.textContent = 'bytes=' + bytes.length + '\n' + hex;
      } catch (err) {
        out.textContent = '读取失败：' + err.message;
      }
    }

    async function writeDevice() {
      const out = document.getElementById('write-result');
      if (!currentDevice) { out.textContent = '请先选择设备'; return; }
      const deviceId = pick(currentDevice, 'Id', 'id');
      const start = parseInt(document.getElementById('write-start').value, 10) || 0;
      const type = parseInt(document.getElementById('write-type').value, 10) || 0;
      const values = document.getElementById('write-values').value
        .split(',').map(function (s) { return parseInt(s.trim(), 10); }).filter(function (n) { return Number.isFinite(n); });
      out.textContent = '请求中…';
      try {
        const res = await fetch('/api/gateway/write', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ deviceId: deviceId, start: start, type: type, values: values })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        out.textContent = '已写入 ' + (json.written != null ? json.written : values.length) + ' 个值';
      } catch (err) {
        out.textContent = '写入失败：' + err.message;
      }
    }

    document.getElementById('theme-toggle').addEventListener('click', function () {
      const html = document.documentElement;
      html.classList.toggle('dark');
      localStorage.setItem('plca-theme', html.classList.contains('dark') ? 'dark' : 'light');
      if (window.lucide) lucide.createIcons();
    });

    document.addEventListener('DOMContentLoaded', function () {
      if (window.lucide) lucide.createIcons();
      loadDevices();
    });
  </script>
</body>
</html>
