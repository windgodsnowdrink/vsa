<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>团队仪表板 · Notion 风格（Live Artifact）</title>
<!-- 单页自包含 · 无外部依赖 · 可离线使用 -->
<style>
  :root{--bg:#ffffff;--panel:#f7f7f5;--line:#e9e9e7;--txt:#37352f;--mut:#9b9a97;--acc:#2f80ed;--ok:#0f9d58;--warn:#f29900;--bad:#eb5757}
  @media(prefers-color-scheme:dark){:root{--bg:#191919;--panel:#202020;--line:#2f2f2f;--txt:#e9e9e7;--mut:#8a8a87;--acc:#4a9eff}}
  *{box-sizing:border-box;margin:0}
  body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);padding:28px;font-size:14px;line-height:1.5}
  .wrap{max-width:1080px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  h1{font-size:22px;font-weight:700}
  .pill{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
  .btn:hover{background:var(--line)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .kpi-t{font-size:12px;color:var(--mut)}
  .kpi-v{font-size:24px;font-weight:700;margin:4px 0}
  .trend{font-size:12px}
  .up{color:var(--ok)}.down{color:var(--bad)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px}
  .panel h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  svg{width:100%;height:160px;display:block}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:500;font-size:12px}
  .tag{font-size:11px;padding:1px 8px;border-radius:10px}
  .t-prog{background:#e6f0ff;color:var(--acc)}.t-done{background:#e3f6ec;color:var(--ok)}
  .t-todo{background:#f1f1ef;color:var(--mut)}.t-block{background:#fde8e8;color:var(--bad)}
  .row{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:8px;align-items:center}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .conn{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
  .chip.on{background:#e6f0ff;border-color:var(--acc);color:var(--acc)}
  .muted{color:var(--mut);font-size:12px}
  .badge{font-size:11px;background:var(--line);color:var(--mut);padding:1px 7px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📋 团队运营仪表板</h1>
    <span class="pill" id="sync">同步：—</span>
    <span class="pill" id="src">数据源：模拟</span>
    <span style="flex:1"></span>
    <button class="btn" id="refresh">⟳ 刷新</button>
    <a class="btn" href="#" id="composio">🔌 Composio 连接器</a>
  </header>

  <!-- KPI -->
  <div class="grid" id="kpis"></div>

  <!-- 图表 + 实时活动流 -->
  <div class="cols">
    <div class="panel">
      <h2>📈 近 7 天趋势</h2>
      <svg id="trend" viewBox="0 0 500 160" preserveAspectRatio="none"></svg>
    </div>
    <div class="panel">
      <h2>⚡ 实时活动流 <span class="badge" id="live">LIVE</span></h2>
      <div id="stream"></div>
    </div>
  </div>

  <!-- 关联数据库任务表 -->
  <div class="panel">
    <h2>🗂️ 关联任务表（数据库视图）</h2>
    <table>
      <thead><tr><th>任务</th><th>负责人</th><th>状态</th><th>关联设备</th><th>截止</th></tr></thead>
      <tbody id="tasks"></tbody>
    </table>
  </div>

  <!-- Composio 连接器目录 -->
  <div class="panel">
    <h2>🔌 Composio 连接器目录</h2>
    <p class="muted">点击绑定连接器后将自动拉取真实数据；未绑定时使用模拟数据，可离线使用。</p>
    <div class="conn" id="connectors"></div>
  </div>
</div>

<script>
  // —— 模拟数据源（未绑定连接器时兜底）——
  const mock = {
    kpis:[
      {t:'设备在线',v:'1,204',d:+1.2},{t:'今日告警',v:'12',d:-0.4},
      {t:'待办任务',v:'34',d:+3},{t:'AI 命中',v:'91%',d:+2.1}
    ],
    trend:[40,52,48,61,57,70,66],
    tasks:[
      {name:'A2-07 温度越限处置',owner:'林工',st:'进行中',dev:'A2-07',due:'08-16'},
      {name:'B1-03 通信抖动排查',owner:'王工',st:'待办',dev:'B1-03',due:'08-17'},
      {name:'C1-12 轴承预测维护',owner:'AI',st:'已完成',dev:'C1-12',due:'08-14'},
      {name:'产线A1 协议升级',owner:'赵工',st:'阻塞',dev:'A1-*',due:'08-20'},
    ],
    connectors:['Notion','Slack','GitHub','Jira','Google Sheets','飞书','企业微信','Webhook']
  };
  const tagClass={'进行中':'t-prog','已完成':'t-done','待办':'t-todo','阻塞':'t-block'};

  function renderKpis(){
    document.getElementById('kpis').innerHTML=mock.kpis.map(k=>{
      const up=k.d>=0;
      return `<div class="card"><div class="kpi-t">${k.t}</div><div class="kpi-v">${k.v}</div>
        <div class="trend ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(k.d)}% 环比</div></div>`;
    }).join('');
  }
  function renderTrend(){
    const d=mock.trend,W=500,H=160,max=Math.max(...d)*1.1;
    let pts='';
    d.forEach((v,i)=>{const x=30+i*(W-50)/(d.length-1);const y=H-20-(v/max)*(H-40);pts+=`${i?'L':''}${x.toFixed(0)},${y.toFixed(0)} `;});
    document.getElementById('trend').innerHTML=
      `<path d="${pts} L${W-20},${H-20} L30,${H-20} Z" fill="#2f80ed" fill-opacity=".1"/>
       <path d="${pts}" fill="none" stroke="#2f80ed" stroke-width="2.5"/>`+
      d.map((v,i)=>{const x=30+i*(W-50)/(d.length-1);const y=H-20-(v/max)*(H-40);return `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="3" fill="#2f80ed"/>`;}).join('');
  }
  function renderTasks(){
    document.getElementById('tasks').innerHTML=mock.tasks.map(t=>
      `<tr><td>${t.name}</td><td>${t.owner}</td><td><span class="tag ${tagClass[t.st]}">${t.st}</span></td>
       <td><span class="badge">${t.dev}</span></td><td>${t.due}</td></tr>`).join('');
  }
  function renderConnectors(){
    document.getElementById('connectors').innerHTML=mock.connectors.map(c=>
      `<span class="chip" onclick="this.classList.toggle('on')">${c}</span>`).join('');
  }
  const acts=['林工 处置 A2-07 告警','AI 生成 C1-12 维护建议','王工 认领 B1-03','系统 自动归档旧任务','赵工 更新 A1 协议进度'];
  function pushAct(){
    const s=document.getElementById('stream');const li=document.createElement('div');li.className='row';
    li.innerHTML=`<span class="dot" style="background:#0f9d58"></span><span>${acts[Math.floor(Math.random()*acts.length)]}</span>
      <span class="muted" style="margin-left:auto">${new Date().toLocaleTimeString()}</span>`;
    s.prepend(li);if(s.children.length>7)s.lastChild.remove();
  }
  function refresh(){
    renderKpis();renderTrend();renderTasks();renderConnectors();
    document.getElementById('sync').textContent='同步：'+new Date().toLocaleTimeString();
    document.getElementById('src').textContent='数据源：模拟';
  }
  // 打开时自动刷新 + 按需刷新 + 实时流
  refresh();
  document.getElementById('refresh').onclick=refresh;
  for(let i=0;i<4;i++)pushAct();
  setInterval(pushAct,3000);
  document.getElementById('composio').onclick=(e)=>{e.preventDefault();alert('Composio 连接器目录：点击上方 chip 模拟绑定；生产环境经 Composio API 拉取真实数据。');};
</script>
</body>
</html>
