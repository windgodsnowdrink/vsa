openapi: 3.2.0
info:
  title: PLC·AIOT 多租户 SaaS API
  version: 1.0.0
  description: >-
    Phase 2 机器可读契约（Spec-as-Contract）。覆盖 SaaS-Spec §5 全部端点，是前后端联调唯一依据。
    所有认证端点要求 JWT Bearer，且令牌必须包含 tid（租户标识）声明；跨租户访问一律返回 403。
    Billing 上下文只计量不收费（ADR-108）：套餐档与用量响应均不含任何价格 / 货币 / 金额字段。
    统一响应信封：{ code, message, data }；HTTP 错误沿用同一信封（data 为 null）。
servers:
  - url: http://localhost:5000
    description: 本地 File-based 服务端
  - url: https://api.plc-aiot.example
    description: 生产占位（部署时替换）
security:
  - bearerAuth: []
tags:
  - name: Tenant
  - name: Identity
  - name: Billing
  - name: Devices
  - name: Faults
  - name: Operations

paths:
  # ---------- 5.1 租户（Tenant 上下文） ----------
  /api/v1/tenants:
    post:
      summary: 自助开通租户并自动预置
      tags: [Tenant]
      description: 匿名（落地页）。创建租户、预置 TenantId 与默认管理员账号。G1。
      operationId: CreateTenant
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: 已创建并返回默认管理员入口
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/tenants/{id}:
    get:
      summary: 租户详情（平台运营）
      tags: [Tenant]
      description: 超管（tid=root）查询任意租户详情与运营指标。
      operationId: GetTenant
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
      responses:
        '200':
          description: 租户详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantDetailResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ops/tenants/{id}/suspend:
    post:
      summary: 平台暂停租户（运营态）
      tags: [Operations]
      description: 超管将租户置为 Suspended；读写被拒（读降级只读快照），数据保留。G7 / AC-07。
      operationId: SuspendTenant
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
      responses:
        '200':
          description: 已暂停
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ops/tenants/{id}/resume:
    post:
      summary: 平台恢复租户
      tags: [Operations]
      description: 超管将租户从 Suspended 恢复为 Active。G7。
      operationId: ResumeTenant
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
      responses:
        '200':
          description: 已恢复
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------- 5.2 身份（Identity 上下文） ----------
  /api/v1/auth/login:
    post:
      summary: 租户标识 + 账号登录，签发 JWT
      tags: [Identity]
      description: 匿名。提交租户 slug + 账号密码，签发含 tid 声明的 access/refresh token。G3。
      operationId: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      summary: refresh token 换发 access token
      tags: [Identity]
      description: 使用 refresh token 换发新 access token；无 header 鉴权，凭据在请求体。
      operationId: Refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 换发成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/tenant/members:
    get:
      summary: 列租户内成员与角色
      tags: [Identity]
      description: 租户内任意已认证用户可列出本租户成员（含角色）。
      operationId: ListMembers
      responses:
        '200':
          description: 成员列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MemberResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: 添加成员并分配角色
      tags: [Identity]
      description: 仅管理员。G4。角色限定四角色内。
      operationId: AddMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberAddRequest'
      responses:
        '201':
          description: 已添加
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MemberResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/tenant/members/{id}/role:
    post:
      summary: 修改成员角色
      tags: [Identity]
      description: 仅管理员。角色限定四角色内（Admin/Analyst/Operator/DeviceEng）。
      operationId: UpdateMemberRole
      parameters:
        - $ref: '#/components/parameters/MemberIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MemberResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/mqtt/credential:
    post:
      summary: 用 JWT 派生短时 MQTT 凭据（含 tid）
      tags: [Identity]
      description: >-
        租户内任意已认证用户可获取用于连接 EMQX 的短时 MQTT 凭据（ADR-107）。
        凭据内嵌 tid，Broker 层 ACL 据此限制仅可访问本租户名下 deviceId 主题。
        password 字段为 MQTT 连接口令（由 JWT 派生），非金额字段。
      operationId: IssueMqttCredential
      responses:
        '200':
          description: 已签发
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MqttCredentialResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------- 5.3 计费 / 计量（Billing —— 只计量不收费） ----------
  /api/v1/billing/usage:
    get:
      summary: 本租户设备数 / 遥测用量 / 配额剩余
      tags: [Billing]
      description: 只计量不收费（ADR-108）。响应无任何价格 / 货币 / 金额字段。G5 / AC-10。
      operationId: GetUsage
      responses:
        '200':
          description: 用量与配额剩余
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UsageResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/billing/plan:
    get:
      summary: 当前套餐档
      tags: [Billing]
      description: 返回当前套餐档（名称 + 配额），无价格字段。
      operationId: GetPlan
      responses:
        '200':
          description: 当前套餐档
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PlanResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: 切换套餐档（免费档间）
      tags: [Billing]
      description: 仅管理员。切换套餐档导致配额变化；不产生费用（ADR-108）。
      operationId: ChangePlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanChangeRequest'
      responses:
        '200':
          description: 已切换
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PlanResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/billing/quota:
    get:
      summary: 配额阈值与超限策略
      tags: [Billing]
      description: 返回本租户套餐的配额阈值与超限动作（Warn / Throttle）。G8。
      operationId: GetQuota
      responses:
        '200':
          description: 配额策略
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuotaResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------- 5.4 既有 PLC 域（全部带 TenantId） ----------
  /api/v1/devices:
    get:
      summary: 设备列表（按租户过滤）
      tags: [Devices]
      description: 返回当前租户设备；全局过滤器自动附加 WHERE TenantId=当前。G2 / AC-02。
      operationId: ListDevices
      parameters:
        - $ref: '#/components/parameters/PageQuery'
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeviceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/faults/{id}/ack:
    post:
      summary: 确认告警
      tags: [Faults]
      description: >-
        确认告警（分析师拒绝，AC-04）。非分析师租户用户可调用；
        跨租户设备 ID 返回 403（AC-03）。成功后经 SignalR 直推角标（ADR-105）。
      operationId: AcknowledgeFault
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        '200':
          description: 已确认
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AckFaultResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/faults/stream:
    get:
      summary: 实时告警角标流（SignalR Hub）
      tags: [Faults]
      description: >-
        SignalR Hub 协商端点（Hub 名 faults）。客户端经 negotiate 升级到 WebSocket 后订阅，
        告警确认等域内事件由 Hub 直推前端角标（ADR-105），热路径强一致，不经读副本。AC-08。
      operationId: StreamFaults
      x-signalr-hub: faults
      responses:
        '200':
          description: 协商成功，可升级到 SignalR WebSocket
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectionId:
                    type: string
                  negotiateUrl:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------- 5.5 平台运营（超管） ----------
  /api/v1/ops/tenants:
    get:
      summary: 全部租户 + 健康
      tags: [Operations]
      description: 超管列出全部租户及其运营健康。
      operationId: ListOpsTenants
      responses:
        '200':
          description: 租户运营列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OpsTenantResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ops/pricing:
    get:
      summary: 计费策略 / 套餐档定义
      tags: [Operations]
      description: 超管查看套餐档与配额策略定义（无价格字段，ADR-108）。
      operationId: GetPricing
      responses:
        '200':
          description: 计费策略
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PricingResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ops/roles:
    get:
      summary: 全局角色与权限矩阵
      tags: [Operations]
      description: 超管查看四角色权限矩阵。
      operationId: GetRoleMatrix
      responses:
        '200':
          description: 权限矩阵
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoleMatrixResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ops/health:
    get:
      summary: 平台健康（SLO）
      tags: [Operations]
      description: 超管查看平台 SLO 与各组件健康。
      operationId: GetHealth
      responses:
        '200':
          description: 平台健康
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT Bearer。令牌必须包含 tid 声明（租户标识）；跨租户访问一律返回 403。
        access token 有效期 15 分钟；refresh 经 POST /auth/refresh 换发。

  parameters:
    TenantIdPath:
      name: id
      in: path
      required: true
      description: 租户 ID（UUID）
      schema:
        type: string
        format: uuid
    MemberIdPath:
      name: id
      in: path
      required: true
      description: 成员用户 ID（UUID）
      schema:
        type: string
        format: uuid
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

  responses:
    Unauthorized:
      description: 未认证或令牌无效 / 过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    Forbidden:
      description: >-
        禁止访问。用于跨租户拒绝（AC-03）、角色不足（如分析师调用写入口，AC-04）、或非超管访问运营接口。
        不泄露被拒资源的任何字段。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    NotFound:
      description: 资源不存在（或当前租户无权限，统一返回 404/403 不泄露归属）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    Conflict:
      description: 资源冲突（如 slug 唯一性校验失败、套餐切换冲突）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    TooManyRequests:
      description: 触发租户级速率限制（按配额）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'

  schemas:
    ApiEnvelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 0 表示成功；非 0 为应用 / HTTP 错误码
          example: 0
        message:
          type: string
          example: ""
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: 业务数据；错误时为 null

    TenantCreateRequest:
      type: object
      required: [companyName, slug, adminEmail, adminPassword]
      properties:
        companyName:
          type: string
          example: 测试制造企业
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{2,30}$'
          description: 租户唯一标识（子域 / 路由用），小写
          example: test-mfg
        adminEmail:
          type: string
          format: email
        adminPassword:
          type: string
          minLength: 8
          writeOnly: true

    TenantResponse:
      type: object
      required: [id, name, slug, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [Active, Suspended]
        createdAt:
          type: string
          format: date-time
        adminUserId:
          type: string
          format: uuid

    TenantDetailResponse:
      allOf:
        - $ref: '#/components/schemas/TenantResponse'
        - type: object
          properties:
            metrics:
              type: object
              properties:
                deviceCount:
                  type: integer
                activeDevices:
                  type: integer
                openFaults:
                  type: integer

    LoginRequest:
      type: object
      required: [tenant, email, password]
      properties:
        tenant:
          type: string
          description: 租户 slug
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType, tenantId]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: access token 有效期（秒），固定 900（15 分钟）
          example: 900
        tokenType:
          type: string
          example: Bearer
        tenantId:
          type: string
          format: uuid
          description: tid 声明镜像，便于客户端路由

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    MemberResponse:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [Admin, Analyst, Operator, DeviceEng]

    MemberAddRequest:
      type: object
      required: [email, name, role]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [Admin, Analyst, Operator, DeviceEng]

    RoleUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [Admin, Analyst, Operator, DeviceEng]

    MqttCredentialResponse:
      type: object
      required: [url, username, password, expiresAt]
      properties:
        url:
          type: string
          description: EMQX 连接地址
        username:
          type: string
          description: MQTT 用户名（内嵌 tid）
        password:
          type: string
          writeOnly: true
          description: MQTT 连接口令（由用户 JWT 派生），非金额字段
        expiresAt:
          type: string
          format: date-time
        tokenType:
          type: string
          example: MQTT-JWT

    UsageResponse:
      type: object
      required: [period, deviceCount, telemetryPoints, quotaRemaining]
      properties:
        period:
          type: string
          description: 计费周期（月），格式 YYYY-MM
          example: "2026-08"
        deviceCount:
          type: integer
          description: 当期设备数
        telemetryPoints:
          type: integer
          description: 当期遥测点数（累计）
        quotaRemaining:
          type: object
          description: 配额剩余（由套餐配额 - 用量派生，不存储价格）
          properties:
            devices:
              type: integer
            telemetry:
              type: integer
        plan:
          $ref: '#/components/schemas/PlanResponse'

    PlanResponse:
      type: object
      required: [id, name, deviceQuota, telemetryQuota]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          enum: [免费, 专业, 商业, 企业]
          description: 套餐档仅作配额差异化，无价格字段（ADR-108）
        deviceQuota:
          type: integer
          description: 设备配额上限
        telemetryQuota:
          type: integer
          description: 遥测点配额上限（周期）

    PlanChangeRequest:
      type: object
      required: [planId]
      properties:
        planId:
          type: string
          format: uuid

    QuotaPolicy:
      type: object
      required: [metric, thresholdPct, action]
      properties:
        metric:
          type: string
          enum: [device, telemetry]
        thresholdPct:
          type: number
          minimum: 0
          maximum: 100
          example: 90
        action:
          type: string
          enum: [Warn, Throttle]

    QuotaResponse:
      type: object
      required: [planId, policies]
      properties:
        planId:
          type: string
          format: uuid
        policies:
          type: array
          items:
            $ref: '#/components/schemas/QuotaPolicy'

    DeviceResponse:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [online, offline, fault]
        lastHeartbeat:
          type: string
          format: date-time
          nullable: true

    AckFaultResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [acked]
        ackedBy:
          type: string
          format: uuid
        ackedAt:
          type: string
          format: date-time

    OpsTenantResponse:
      type: object
      required: [id, name, slug, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [Active, Suspended]
        createdAt:
          type: string
          format: date-time
        deviceCount:
          type: integer
        openFaults:
          type: integer
        planName:
          type: string
          enum: [免费, 专业, 商业, 企业]

    PricingResponse:
      type: object
      required: [plans, quotaPolicies]
      properties:
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PlanResponse'
        quotaPolicies:
          type: array
          items:
            $ref: '#/components/schemas/QuotaPolicy'

    RolePermission:
      type: object
      required: [role, permissions]
      properties:
        role:
          type: string
          enum: [Admin, Analyst, Operator, DeviceEng]
        permissions:
          type: array
          items:
            type: string
          description: 该角色拥有的权限键列表（只读 / 设备读写 / 成员管理 / 套餐切换 等）

    RoleMatrixResponse:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolePermission'

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [Healthy, Degraded, Down]
        sla:
          type: object
          properties:
            uptimePct:
              type: number
              example: 99.95
        components:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
                enum: [Healthy, Degraded, Down]

    FaultStreamMessage:
      type: object
      description: SignalR faults Hub 推送消息结构（示例）
      required: [type, tenantId]
      properties:
        type:
          type: string
          enum: [fault.created, fault.acked, badge.update]
        tenantId:
          type: string
          format: uuid
        payload:
          type: object
          additionalProperties: true
