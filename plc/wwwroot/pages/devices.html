<div data-page="devices">
  <div class="page-head">
    <div>
      <h1>设备管理</h1>
      <p>实时接入边缘网关设备目录（配置态 · 同源调用 /api/gateway/devices）</p>
    </div>
    <div class="head-actions">
      <span class="pill">最后同步 <span id="lastSync">刚刚</span></span>
      <button class="btn btn-primary" onclick="location.reload()"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-refresh-cw"/></svg> 刷新</button>
    </div>
  </div>

  <div class="card hover" style="margin-bottom:14px">
    <div class="row" style="align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div class="row" style="gap:8px;align-items:center">
        <svg class="ico ico-sm" aria-hidden="true"><use href="#i-sliders-horizontal"/></svg>
        <span style="font-size:13px;font-weight:600">状态筛选</span>
        <select id="devFilter" class="select" style="width:auto">
          <option value="">全部</option>
          <option value="在线">在线</option>
          <option value="离线">离线</option>
        </select>
      </div>
      <span id="devCount" class="pill" style="margin-left:auto"></span>
    </div>
  </div>

  <div class="dev-grid" id="devGrid"></div>

  <div class="row" id="devPager" style="justify-content:center;gap:10px;margin-top:18px"></div>
</div>
