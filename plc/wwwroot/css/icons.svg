       【Phase 3 一键重建，确保路径权威（覆盖本文件）】
       npx lucide static wwwroot/css/icons.svg \
         menu search sun-moon bell bell-ring x layout-dashboard cpu activity map \
         bar-chart-3 megaphone kanban sliders-horizontal boxes building-2 credit-card \
         shield-check key-round gauge users chevrons-up-down check receipt arrow-up-right \
         ban circle-check plus pencil more-horizontal lock eye minus scroll-text alert-triangle \
