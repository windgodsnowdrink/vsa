<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLC·AIOT 控制台 — 工业物联网平台</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="icon" href="favicon.png" />
</head>
<body>
  <a class="skip-link" href="#view">跳到主内容</a>
  <div class="shell">

    <!-- 侧边栏 -->
    <aside class="sidebar glass" id="sidebar">
      <div class="brand">
        <div class="logo">P</div>
        <b>PLC·<span class="accent">AIOT</span></b>
      </div>
      <nav class="nav" id="sideNav"></nav>
      <div class="foot">
        <div><span class="dot"></span> MQTT 已连接</div>
        <div style="margin-top:6px">edge: Mosquitto · cloud: EMQX</div>
      </div>
    </aside>
    <div class="side-overlay" id="sideOverlay"></div>

    <!-- 主区 -->
    <div class="main">
      <header class="topbar glass">
        <button class="icon-btn hamburger" id="hamburger" aria-label="菜单"><svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg></button>

        <!-- 租户切换器（顶栏常驻，SaaS 上下文开关） -->
        <div class="tenant-switcher" id="tenantSwitcher">
          <button class="ts-trigger" id="tsTrigger" aria-haspopup="listbox" aria-expanded="false">
            <svg class="ico ico-sm" aria-hidden="true"><use href="#i-building-2"/></svg>
            <span class="ts-name" id="tsName">—</span>
            <svg class="ico ico-sm" aria-hidden="true"><use href="#i-chevrons-up-down"/></svg>
          </button>
          <div class="ts-menu glass" id="tsMenu" role="listbox" aria-label="切换组织" aria-activedescendant="" hidden>
            <div class="ts-search">
              <svg class="ico ico-sm" aria-hidden="true"><use href="#i-search"/></svg>
              <input id="tsSearch" placeholder="搜索组织…" aria-label="搜索组织" autocomplete="off" />
            </div>
            <div class="ts-list" id="tsList" role="presentation"></div>
            <div class="ts-empty" id="tsEmpty" hidden>未找到匹配的组织</div>
          </div>
        </div>

        <div class="search">
          <span class="mag"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-search"/></svg></span>
          <input id="globalSearch" placeholder="搜索设备 / 指令 / 告警…" aria-label="全局搜索" />
          <div class="search-results" id="searchResults" role="listbox" aria-label="搜索结果"></div>
        </div>
        <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题"><svg class="ico" aria-hidden="true"><use href="#i-sun-moon"/></svg></button>
        <button class="icon-btn" id="bellBtn" title="通知" aria-label="通知"><svg class="ico" aria-hidden="true"><use href="#i-bell-ring"/></svg><span class="ping"></span></button>
        <div class="avatar">林</div>
      </header>

      <!-- 移动端横向导航（桌面隐藏） -->
      <nav id="topNav" class="topnav" aria-label="快捷导航"></nav>

      <!-- HTMX 片段注入容器 -->
      <main class="content scroll-thin" id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- 通知中心 -->
  <div class="notif glass" id="notif">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <h3>通知中心</h3><button class="icon-btn" id="notifClose" style="width:30px;height:30px" aria-label="关闭通知"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>
    <ul>
      <li class="notif-item" data-dev="ZZ-A2-07"><span class="badge bad">告警</span> A2-07 温度越限 78℃</li>
      <li class="notif-item" data-dev="SZ-B1-03"><span class="badge warn">预警</span> B1-03 通信抖动</li>
      <li class="notif-item" data-dev="CD-C1-12"><span class="badge info">AI</span> C1-12 预测轴承磨损</li>
    </ul>
  </div>

  <!-- 设备详情抽屉 -->
  <div class="mask" id="drawerMask" aria-hidden="true"></div>
  <aside class="drawer glass" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dwName">
    <div class="dh">
      <div><div style="font-weight:700" id="dwName">设备详情</div><div style="font-size:12px;color:var(--text-3)" id="dwId"></div></div>
      <button class="icon-btn" id="dwClose" style="width:32px;height:32px" aria-label="关闭设备详情"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="tabs" id="dwTabs"></div>
    <div class="db scroll-thin" id="dwBody"></div>
  </aside>

  <!-- 租户切换确认弹窗（alertdialog，高成本操作） -->
  <div class="mask" id="tsMask" aria-hidden="true"></div>
  <div class="dialog glass" id="tsDialog" role="alertdialog" aria-modal="true" aria-labelledby="tsDlgTitle" aria-describedby="tsDlgDesc" hidden>
    <div class="dh">
      <h3 id="tsDlgTitle">切换组织</h3>
      <button class="icon-btn" id="tsDlgClose" style="width:32px;height:32px" aria-label="取消"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <p id="tsDlgDesc" class="sub">切换组织后将返回首页并刷新该组织数据，确定继续？</p>
    <div class="ts-dlg-target" id="tsDlgTarget"></div>
    <div class="dialog-actions">
      <button class="btn btn-ghost" id="tsDlgCancel">取消</button>
      <button class="btn btn-primary" id="tsDlgConfirm">确定切换</button>
    </div>
  </div>

  <div class="tip" id="tip"></div>

  <!-- 本地化依赖（离线可用） -->
  <script src="vendor/htmx.min.js"></script>
  <script src="vendor/axios.min.js"></script>
  <script src="js/app.js"></script>

  <!-- =========================================================
       Lucide 图标雪碧图（内联，使 <use href="#i-xxx"/> 在 HTMX 片段内生效）
       源真值：wwwroot/css/icons.svg（Phase 3 一键重建）
       本内联副本含 2 个手动补充符号：i-bot（AI 诊断）、i-refresh-cw（刷新），
       已记录待补清单：须加入 icons.svg 顶部的 lucide CLI 列表以防重建丢失。
       ========================================================= -->
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-menu" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-sun-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
      <symbol id="i-bell-ring" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="M2 10l2 2"/><path d="M22 10l-2 2"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
      <symbol id="i-layout-dashboard" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="13" rx="1"/><rect width="7" height="5" x="3" y="13" rx="1"/></symbol>
      <symbol id="i-cpu" viewBox="0 0 24 24"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></symbol>

      <symbol id="i-bar-chart-3" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></symbol>
      <symbol id="i-megaphone" viewBox="0 0 24 24"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></symbol>
      <symbol id="i-kanban" viewBox="0 0 24 24"><path d="M6 5v11"/><path d="M12 5v6"/><path d="M18 5v9"/></symbol>
      <symbol id="i-sliders-horizontal" viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></symbol>
      <symbol id="i-boxes" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></symbol>
      <symbol id="i-building-2" viewBox="0 0 24 24"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></symbol>

      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
      <symbol id="i-chevrons-up-down" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6"/><path d="M16 12h-6"/><path d="M16 16h-6"/></symbol>
      <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></symbol>
      <symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.9" y1="4.9" x2="19.1" y2="19.1"/></symbol>
      <symbol id="i-circle-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></symbol>
      <symbol id="i-more-horizontal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-scroll-text" viewBox="0 0 24 24"><path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h11a2 2 0 0 0 2-2v-1"/></symbol>
      <symbol id="i-alert-triangle" viewBox="0 0 24 24"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
      <symbol id="i-refresh-cw" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></symbol>
      <symbol id="i-bot" viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></symbol>
    </defs>
  </svg>
</body>
</html>
