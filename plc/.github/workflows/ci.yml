name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 注意：.NET 11 Preview 6 可能不在 GitHub Hosted Runner 默认源。
# 若 setup-dotnet 拉不到 11.0.100-preview.6，请将本 workflow 改跑自托管 Runner（预装 preview SDK）。

permissions:
  contents: read
  security-events: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 11 Preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-preview.6'
      - name: Restore
        run: dotnet restore plc-saas/plc-saas.verify/plc-saas.verify.csproj
      - name: Build (backend typecheck via verify project)
        run: dotnet build plc-saas/plc-saas.verify/plc-saas.verify.csproj --no-restore
      - name: Test (incl. ADR-108 currency red-line scan)
        run: dotnet test plc-saas/plc-saas.verify/plc-saas.verify.csproj --no-build
      - name: Frontend syntax check
        run: for f in wwwroot/js/*.js; do node --check "$f"; done

  security:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-preview.6'
      - name: Dependency CVE check
        run: dotnet list plc-saas/plc-saas.verify/plc-saas.verify.csproj package --vulnerable
      - name: Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            scripts/semgrep/

  review-gates:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: P0 gates (emoji / hardcoded colors / currency / purple-pink)
        run: bash scripts/review-gates.sh

  deploy:
    runs-on: ubuntu-latest
    needs: [security, review-gates]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder deploy (wire to intranet/staging)
        run: echo "Deploy plc-saas (dotnet run Program.cs) + wwwroot to target env (TBD)"
