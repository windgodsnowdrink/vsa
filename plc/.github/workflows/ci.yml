name: plc-saas CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: plc-saas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # —— 自动门禁 ①：构建 + 单元/红线校验（ADR-108 + 切片全量 typecheck + 纯逻辑用例）——
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-preview.7'
          include-prerelease: true
      - name: Restore
        run: |
          dotnet restore src/plc-saas/plc-saas.csproj
          dotnet restore src/plc-saas.verify/plc-saas.verify.csproj
      - name: Build plc-saas
        run: dotnet build src/plc-saas/plc-saas.csproj -c Release --no-restore
      - name: Verify gate (ADR-108 + typecheck + 纯逻辑)
        # .NET 11 SDK 已移除 VSTest；xunit.v3 走 Microsoft.Testing.Platform。
        # 经实测 dotnet test 在该 SDK 下仍路由到已删除的 VSTest 目标而报错，
        # 故改用原生 MTP 运行器 dotnet run（等价 dotnet test，退出码反映测试结果）。
        run: dotnet run --project src/plc-saas.verify/plc-saas.verify.csproj -c Release

  # —— 自动门禁 ②：Docker 镜像可构建（历史未闭环项）——
  docker:
    needs: build-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (不推送)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/plc-saas/Dockerfile
          push: false
          tags: plc-saas:ci

  # —— 集成门禁：SaaS 控制台 e2e（含普通租户登录路径 + /ops/pricing，此前 e2e 盲点）——
  # 依赖 PG（必选）+ EMQX（桥接默认关闭，可选）；运行时配置经环境变量注入。
  e2e:
    needs: build-verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: plcsaas
          POSTGRES_PASSWORD: plcsaas
          POSTGRES_DB: plc_aiot_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plcsaas"
          --health-interval 10s --health-timeout 5s --health-retries 5
      emqx:
        image: emqx:5.8.5
        ports:
          - 18083:18083
          - 51883:51883
        options: >-
          --health-cmd "emqx ctl status"
          --health-interval 15s --health-timeout 5s --health-retries 10
    env:
      # 覆盖应用默认连接串，指向 service 提供的 PG（与本地 wslc 默认凭据一致）
      ConnectionStrings__Default: 'Host=localhost;Port=5432;Database=plc_aiot_saas;Username=plcsaas;Password=plcsaas'
      Jwt__Key: 'ci-e2e-insecure-key-change-me-32+'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-preview.7'
          include-prerelease: true
      - name: Run SaaS console e2e
        run: bash scripts/verify-saas-console.sh
